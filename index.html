<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD COMMUNITY</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0b62c4; --bg2:#073b83; --deep:#051a35;
    --panel:#0f3560; --panel2:#0a2a50; --edge:#071f3d;
    --green:#8ee85d; --green2:#4db32a; --yellow:#ffd93b; --orange:#ff9f2e; --blue:#5db9ff;
    --text:#fff; --mut:#a9c6e8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Rubik',sans-serif;color:var(--text);min-height:100vh;
    background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%,#062f67);background-attachment:fixed}
  button{font:inherit;cursor:pointer}
  ::selection{background:rgba(255,217,59,.4)}
  .mut{color:var(--mut)} .small{font-size:.8rem}

  .gd-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    font-family:'Titan One';font-size:.9rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
    background:linear-gradient(180deg,var(--green),var(--green2));
    border:3px solid #1d5c10;border-radius:12px;padding:11px 20px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #17490d;transition:transform .1s,filter .15s}
  .gd-btn:hover{filter:brightness(1.08)}
  .gd-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 #17490d}
  .gd-btn.blue{background:linear-gradient(180deg,#5db9ff,#2a7fd4);border-color:#0f3d73;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #0c315c}
  .gd-btn.ghost{background:var(--panel);border-color:var(--edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 4px 0 var(--deep)}
  .gd-btn.small{font-size:.72rem;padding:8px 14px;border-width:2px;border-radius:10px}

  .panel{background:var(--panel);border:2px solid var(--edge);border-radius:14px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 4px 0 rgba(0,0,0,.22)}
  .inp,textarea.inp,select.inp{width:100%;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;
    color:#fff;padding:11px 13px;font:inherit;font-size:.95rem;outline:none;transition:border-color .15s}
  .inp:focus{border-color:var(--blue)}
  .inp::placeholder,textarea.inp::placeholder{color:#5f7ea6}
  textarea.inp{resize:vertical}

  .av,.cube{display:inline-block;flex:none;border-radius:18%}
  .av{object-fit:cover;border:2px solid rgba(0,0,0,.35)}
  .cube{position:relative;background:linear-gradient(180deg,var(--c1),var(--c2));
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.25)}
  .cube i,.cube em{position:absolute;background:#102540;border-radius:2px}
  .cube i{top:26%;width:16%;height:26%}
  .cube i:first-child{left:22%} .cube i:nth-child(2){right:22%}
  .cube em{left:30%;right:30%;bottom:18%;height:12%}
  .s28{width:28px;height:28px} .s30{width:30px;height:30px} .s44{width:44px;height:44px}
  .s64{width:64px;height:64px} .s72{width:72px;height:72px} .s96{width:96px;height:96px}
  .admintag{display:inline-block;background:linear-gradient(180deg,#ffe45e,#e0a013);color:#3d2c00;
    font-size:.58rem;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:6px;margin-left:7px;vertical-align:middle}

  /* AUTH */
  .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:30px 18px}
  .logo-big{text-align:center}
  .logo-big h1{font-family:'Titan One';font-size:clamp(2rem,6vw,3.1rem);text-shadow:0 4px 0 rgba(0,0,0,.3);margin-top:14px}
  .logo-big h1 span{color:var(--yellow)}
  .logo-big p{margin-top:6px}
  .auth-card{width:min(400px,100%);padding:24px}
  .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .aform label{display:block;font-size:.66rem;letter-spacing:.2em;color:var(--mut);font-weight:700;margin:14px 0 6px}
  .form-err{color:#ff9090;min-height:22px;font-size:.88rem;margin-top:8px;text-align:center}

  /* TOPBAR */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px clamp(14px,3vw,28px);background:#0a2c55;border-bottom:3px solid var(--deep);box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .logo{font-family:'Titan One';font-size:1.1rem;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
  .logo span{color:var(--green)}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav button{font-family:'Titan One';font-size:.78rem;padding:9px 16px;border-radius:10px;border:2px solid transparent;background:transparent;color:#bcd6f2;transition:.15s}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.active{background:#1c4f92;border-color:#0d3568;color:#fff}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .chip{display:flex;align-items:center;gap:8px;background:none;border:none;color:#fff;font-weight:700;padding:4px 10px;border-radius:10px;transition:.15s}
  .chip:hover{background:rgba(255,255,255,.08)}

  .wrap{max-width:1000px;margin:0 auto;padding:22px clamp(14px,3vw,28px) 70px}
  .page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{font-family:'Titan One';font-size:1.4rem;text-shadow:0 2px 0 rgba(0,0,0,.3)}

  /* FEED */
  .cols{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
  .side-card{position:sticky;top:78px;padding:20px;text-align:center}
  .side-card h3{margin-top:10px;font-size:1.05rem}
  .side-card .bio{margin-top:8px;font-size:.88rem;color:var(--mut);min-height:1em;word-break:break-word}
  .stats{display:flex;gap:8px;margin:16px 0}
  .stats div{flex:1;background:var(--panel2);border-radius:10px;padding:9px 4px}
  .stats b{display:block;color:var(--yellow);font-size:1.02rem}
  .stats span{font-size:.6rem;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
  .composer{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px}
  .composer .stack{display:flex;flex-direction:column;gap:10px}
  .composer .row{display:flex;justify-content:flex-end}
  .feed-list{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .post{padding:16px}
  .post-head{display:flex;gap:11px;align-items:center}
  .post-head .who b{display:block;font-size:.98rem}
  .post-head .who span{font-size:.78rem;color:var(--mut)}
  .gtag{margin-left:auto;font-size:.72rem;background:#1c4f92;border:1px solid #0d3568;color:#cfe3fa;border-radius:99px;padding:4px 11px;white-space:nowrap}
  .gtag:hover{background:#2663b3}
  .post-text{margin-top:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:.96rem}
  .post-actions{display:flex;gap:6px;align-items:center;margin-top:11px;border-top:1px solid rgba(255,255,255,.07);padding-top:9px}
  .act{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-size:.9rem;padding:6px 11px;border-radius:8px;transition:.15s}
  .act:hover{background:rgba(255,255,255,.08);color:#fff}
  .act.liked{color:var(--yellow)}
  .del{background:none;border:none;color:#6c88ab;font-size:.78rem;padding:5px 9px;border-radius:8px;transition:.15s}
  .del:hover{color:#ff8a8a;background:rgba(255,90,90,.12)}
  .comments{margin-top:10px}
  .cmt{display:flex;gap:9px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:.9rem;align-items:flex-start}
  .cmt .mut{font-size:.74rem}
  .cmt-body{min-width:0;word-break:break-word}
  .cmt .del{margin-left:auto}
  .cmt-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .cmt-form .inp{flex:1;min-width:120px}
  .empty{padding:30px;text-align:center;color:var(--mut)}

  /* GROUPS */
  .g-create{display:flex;gap:10px;padding:14px;flex-wrap:wrap;margin-bottom:16px}
  .g-create .inp{flex:1;min-width:160px}
  .g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
  .g-card{padding:16px;cursor:pointer;transition:transform .15s}
  .g-card:hover{transform:translateY(-3px)}
  .g-card .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .g-emoji{font-size:1.9rem}
  .g-card h4{font-size:1rem}
  .g-card p{font-size:.85rem;color:var(--mut);margin:6px 0 10px;min-height:2.5em}
  .g-foot{display:flex;align-items:center;justify-content:space-between}
  .g-head{display:flex;gap:16px;align-items:center;padding:18px;margin-bottom:16px;flex-wrap:wrap}
  .g-head .g-emoji{font-size:3rem}
  .g-head .info{flex:1;min-width:180px}
  .g-head h2{font-family:'Titan One';font-size:1.3rem}
  .g-head p{color:var(--mut);font-size:.9rem;margin-top:3px}

  /* LISTS */
  .l-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-top:6px}
  .l-card{cursor:pointer;overflow:hidden;transition:transform .15s}
  .l-card:hover{transform:translateY(-3px)}
  .lc-banner{height:92px;background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font-size:2.2rem}
  .lc-icon{position:absolute;left:14px;bottom:-17px;width:46px;height:46px;border-radius:12px;background:var(--panel2);border:2px solid var(--edge);display:grid;place-items:center;font-size:1.4rem}
  .lc-body{padding:24px 16px 16px}
  .lc-body h4{font-family:'Titan One';font-size:1rem}
  .lc-body p{font-size:.85rem;color:var(--mut);margin:6px 0 10px;min-height:2.4em;word-break:break-word}
  .lc-meta{font-size:.72rem;color:var(--mut);line-height:1.5}
  .pick-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .icon-pick{width:36px;height:36px;border-radius:9px;border:2px solid var(--edge);background:var(--panel2);font-size:18px;display:grid;place-items:center;transition:.15s}
  .icon-pick:hover{transform:scale(1.08)}
  .icon-pick.sel{border-color:var(--yellow);background:rgba(255,217,59,.14)}
  .color-pick{width:34px;height:34px;border-radius:9px;border:2px solid rgba(255,255,255,.18);transition:.15s}
  .color-pick:hover{transform:scale(1.1)}
  .color-pick.sel{box-shadow:0 0 0 2px var(--deep),0 0 0 4px #fff}
  .banprev{height:86px;border-radius:10px;background-size:cover;background-position:center;border:2px dashed var(--edge);display:grid;place-items:center;color:var(--mut);font-size:.8rem;margin-top:8px}
  .m-label{font-size:.64rem;letter-spacing:.2em;color:var(--mut);font-weight:700;margin:14px 0 6px;display:block}
  .tagchip{background:#1c4f92;border-radius:99px;padding:3px 10px;font-size:.72rem;color:#cfe3fa;white-space:nowrap}
  .lv-banner{height:150px;border-radius:12px 12px 0 0;background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font-size:3rem}
  .lv-icon{position:absolute;left:20px;bottom:-22px;width:60px;height:60px;border-radius:14px;background:var(--panel2);border:2px solid var(--edge);display:grid;place-items:center;font-size:1.9rem}
  .lv-head{padding:34px 20px 18px}
  .lv-head h2{font-family:'Titan One';font-size:1.5rem}
  .lv-head .desc{color:var(--mut);margin-top:6px;word-break:break-word}
  .lv-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.78rem;color:var(--mut)}
  .ltabs{display:flex;gap:8px;margin:18px 0 14px}
  .ltab{font-family:'Titan One';font-size:.78rem;padding:9px 18px;border-radius:10px;border:2px solid var(--edge);background:var(--panel);color:var(--mut);transition:.15s}
  .ltab:hover{color:#fff}
  .ltab.active{background:#1c4f92;color:#fff;border-color:#0d3568}
  .i-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;margin-top:6px}
  .i-card{padding:12px;cursor:pointer;transition:transform .15s}
  .i-card:hover{transform:translateY(-3px)}
  .i-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:2px solid var(--edge);display:block}
  .i-ph{width:100%;aspect-ratio:16/9;border-radius:10px;border:2px solid var(--edge);display:grid;place-items:center;font-size:2rem;background:var(--panel2)}
  .i-card h4{margin-top:10px;font-size:.98rem;word-break:break-word}
  .i-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .i-foot{display:flex;gap:10px;margin-top:10px;font-size:.78rem;color:var(--mut);flex-wrap:wrap;align-items:center}
  .item-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start;margin-top:14px}
  .main-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid var(--edge);display:block}
  .main-ph{width:100%;aspect-ratio:4/3;border-radius:12px;border:2px solid var(--edge);display:grid;place-items:center;font-size:3.4rem;background:var(--panel2)}
  .ph-strip{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .ph-strip img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid var(--edge);cursor:pointer}
  .ph-strip img.sel{border-color:var(--yellow)}
  .rate-star{background:none;border:none;font-size:1.35rem;color:#3f5f8d;padding:2px;transition:transform .1s}
  .rate-star:hover{transform:scale(1.15)}
  .rate-star.on{color:var(--yellow)}
  .react-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--edge);border-radius:99px;padding:6px 12px;font-size:.9rem;color:#fff;transition:.15s}
  .react-btn:hover{border-color:#1c4f92;background:#1c4f92}
  .react-btn.sel{border-color:var(--green);background:rgba(142,232,93,.14)}
  .item-panel{padding:20px}
  .item-panel h2{font-family:'Titan One';font-size:1.35rem;word-break:break-word}
  .pts-badge{font-family:'Titan One';color:var(--yellow);font-size:1rem}
  .vrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;margin-top:8px;flex-wrap:wrap}
  .f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#b23b3b;color:#fff;border:none;font-size:.6rem;display:grid;place-items:center}
  .lf-row{display:flex;gap:10px;justify-content:flex-end}

  /* LEADERBOARD */
  .lb-row{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-bottom:12px;flex-wrap:wrap}
  .rank{font-family:'Titan One';width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem;background:#1c4f92;border:2px solid #0d3568;flex:none;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .rank.r1{background:linear-gradient(180deg,#ffe45e,#e0a013);border-color:#8a6206;color:#3d2c00;text-shadow:none}
  .rank.r2{background:linear-gradient(180deg,#e8eef4,#9fb2c4);border-color:#5d6f80;color:#22303d;text-shadow:none}
  .rank.r3{background:linear-gradient(180deg,#e8a06a,#b0642e);border-color:#6e3d17;color:#3a2008;text-shadow:none}
  .lb-name{flex:1;min-width:180px}
  .lb-name b{font-size:1rem}
  .lb-clears{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .lb-pts{font-family:'Titan One';color:var(--yellow);font-size:1.15rem;margin-left:auto}

  /* DMS */
  .dms{display:grid;grid-template-columns:230px 1fr;gap:14px;height:calc(100vh - 160px);min-height:430px}
  .dm-list{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .dm-user{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer;color:#fff;font-weight:500;transition:.15s}
  .dm-user:hover{background:rgba(255,255,255,.08)}
  .dm-user.sel{background:#1c4f92}
  .dm-thread{display:flex;flex-direction:column;overflow:hidden}
  .dm-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--edge);font-weight:700}
  #dm-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:72%;padding:9px 13px;border-radius:14px;font-size:.93rem;line-height:1.45;word-break:break-word}
  .bub.mine{align-self:flex-end;background:linear-gradient(180deg,var(--green),var(--green2));color:#0c2b06;border-bottom-right-radius:4px}
  .bub.theirs{align-self:flex-start;background:#1c4f92;border-bottom-left-radius:4px}
  .dm-form{display:flex;gap:8px;padding:12px;border-top:2px solid var(--edge)}
  .dm-empty{height:100%;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}

  /* MODAL / TOAST */
  .overlay{position:fixed;inset:0;background:rgba(3,12,26,.62);display:grid;place-items:center;z-index:40;animation:fadeIn .2s ease;padding:16px}
  .modal{width:min(430px,94vw);padding:24px;animation:pop .25s cubic-bezier(.3,1.4,.5,1);max-height:92vh;overflow-y:auto}
  .modal.wide{width:min(600px,94vw)}
  .m-title{font-family:'Titan One';font-size:1.05rem;margin-bottom:6px}
  .m-av{display:flex;justify-content:center;margin:8px 0 14px}
  .m-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  @keyframes pop{from{transform:scale(.9);opacity:0}}
  @keyframes fadeIn{from{opacity:0}}
  #toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--deep);border:2px solid #123c6e;border-radius:10px;padding:10px 18px;font-size:.9rem;animation:pop .25s ease;white-space:nowrap}
  .toast.error{border-color:#a33;color:#ffb0b0}
  .toast.out{opacity:0;transition:opacity .3s}

  @media(max-width:820px){
    .cols{grid-template-columns:1fr}
    .side-card{position:static}
    .dms{grid-template-columns:1fr;height:auto}
    .dm-list{flex-direction:row;overflow-x:auto;overflow-y:hidden}
    .dm-user{flex:none}
    .dm-thread{height:62vh}
    .item-grid,.f-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);

const DB = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch{ toast('storage full — use smaller images','error'); return false; } }
};
const K = { users:'gd.users', posts:'gd.posts', groups:'gd.groups', dms:'gd.dms', lists:'gd.lists', session:'gd.session' };

const users  = () => DB.get(K.users,[]);
const posts  = () => DB.get(K.posts,[]);
const groups = () => DB.get(K.groups,[]);
const dms    = () => DB.get(K.dms,[]);
const lists  = () => DB.get(K.lists,[]);
const findUser = n => users().find(u=>u.username.toLowerCase()===String(n).toLowerCase());
const isAdmin  = () => !!(me && me.role==='admin');
const canList  = l => isAdmin() || (l && l.author===me.username);

const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hashPw = (u,p) => { let h=5381; const s=u.toLowerCase()+'::'+p; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'h'+h.toString(16); };
const hashNum = s => [...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0);
function ago(t){ const s=Math.floor((Date.now()-t)/1000); if(s<60)return'now'; if(s<3600)return Math.floor(s/60)+'m'; if(s<86400)return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; }
function fmtDate(t){ return new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function normUrl(v){ v=(v||'').trim(); if(!v) return ''; if(!/^https?:\/\//i.test(v)) v='https://'+v; return /^https?:\/\//i.test(v)?v:''; }
function ytId(url){ const m=String(url||'').match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/); return m?m[1]:null; }

function slugify(s){ const map={'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z'};
  return (String(s).toLowerCase().replace(/[ąćęłńóśźż]/g,c=>map[c]).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''))||'lista'; }
function uniqueListSlug(name){ const base=slugify(name); let s=base,i=2; while(lists().some(l=>l.slug===s)) s=base+'-'+(i++); return s; }
function uniqueItemSlug(list,title){ const base=slugify(title)||'level'; let s=base,i=2; while(list.items.some(x=>x.slug===s)) s=base+'-'+(i++); return s; }

/* ---- image helpers ---- */
function loadImage(file){ return new Promise((res,rej)=>{ const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(u);res(img)}; img.onerror=rej; img.src=u; }); }
async function cropImage(file,W,H){ const img=await loadImage(file); const c=document.createElement('canvas'); c.width=W;c.height=H;
  const r=Math.max(W/img.width,H/img.height); c.getContext('2d').drawImage(img,(W-img.width*r)/2,(H-img.height*r)/2,img.width*r,img.height*r);
  return c.toDataURL('image/jpeg',.8); }
async function fitImage(file,max){ const img=await loadImage(file); const r=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.75); }

function toHash(v){
  switch(v.name){
    case 'groups': return '#/groups';
    case 'group': return '#/group/'+v.id;
    case 'lists': return '#/lists';
    case 'listview': return '#/lista/'+v.slug;
    case 'item': return '#/lista/'+v.slug+'/'+v.is;
    case 'rank': return '#/ranking';
    case 'dms': return '#/dms';
    default: return '#/feed';
  }
}
function parseHash(){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(parts[0]==='lista'&&parts[1]) return parts[2]?{name:'item',slug:parts[1],is:parts[2]}:{name:'listview',slug:parts[1]};
  if(['feed','groups','lists','dms','ranking'].includes(parts[0])) return {name:parts[0]==='ranking'?'rank':parts[0]};
  if(parts[0]==='group'&&parts[1]) return {name:'group',id:parts[1]};
  return {name:'feed'};
}
function go(v){ view=v; itemPhoto=0; listTab='levels'; const h=toHash(v); if(location.hash!==h) location.hash=h; else render(); }
window.addEventListener('hashchange',()=>{ view=parseHash(); itemPhoto=0; listTab='levels'; render(); });

function toast(msg,type){ const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),320); },2600); }
function copyText(t){ if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast('link copied 🔗')).catch(()=>toast('copy failed','error')); }
  else prompt('copy this link:',t); }
function saveUser(patch){ const l=users(); const i=l.findIndex(u=>u.username===me.username);
  if(i<0)return; l[i]={...l[i],...patch}; DB.set(K.users,l); me=l[i]; }
function itemCtx(){ if(view.name!=='item')return null; const l=lists().find(x=>x.slug===view.slug); if(!l)return null;
  const it=l.items.find(x=>x.slug===view.is); return it?{list:l,item:it}:null; }

/* ---------- leaderboard ---------- */
function leaderboard(){
  const map={};
  const add=(name,pts,entry)=>{ if(!name)return; const k=name.toLowerCase();
    map[k]=map[k]||{name,pts:0,clears:[]}; map[k].pts+=pts; map[k].clears.push(entry); };
  lists().forEach(l=>l.items.forEach(it=>{
    const pts=+it.points||0;
    if(it.verifier&&it.verifier.name) add(it.verifier.name,pts,{level:it.title,pts,role:'verifier'});
    (it.victors||[]).forEach(v=>add(v.name,pts,{level:it.title,pts,role:'victor'}));
  }));
  return Object.values(map).sort((a,b)=>b.pts-a.pts);
}

function syncListDraft(){ const f=$('#f-list'); if(f&&listDraft){ listDraft.name=f.elements.name.value; listDraft.desc=f.elements.desc.value; listDraft.rules=f.elements.rules.value; } }
function syncItemDraft(){ const f=$('#f-item'); if(f&&itemDraft){ itemDraft.title=f.elements.title.value; itemDraft.desc=f.elements.desc.value;
  itemDraft.tags=f.elements.tags.value; itemDraft.points=f.elements.points.value;

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='m-close' && e.target.closest('.modal')) return;
  switch(act){
    case 'auth-tab': authTab=b.dataset.tab; render(); break;
    case 'nav': go({name:b.dataset.view}); break;
    case 'nav-go': go({name:b.dataset.to}); break;
    case 'logout': DB.set(K.session,null); profileOpen=false; listModal=null; itemModal=null; ytModal=null; dmWith=null; openComments.clear(); location.hash='#/feed'; render(); break;
    case 'profile': profileOpen=true; render(); break;
    case 'm-close': case 'm-close-btn': closeModal(); break;
    case 'remove-photo': saveUser({avatar:null}); toast('photo removed'); render(); break;
    case 'like': { const l=posts(); const p=l.find(x=>x.id===b.dataset.id);
      if(p){ const i=p.likes.indexOf(me.username); i<0?p.likes.push(me.username):p.likes.splice(i,1); DB.set(K.posts,l); render(); } break; }
    case 'comments': { const id=b.dataset.id; openComments.has(id)?openComments.delete(id):openComments.add(id); render(); break; }
    case 'del-post': { const l=posts(); const p=l.find(x=>x.id===b.dataset.id);
      if(p&&(isAdmin()||p.author===me.username)){ DB.set(K.posts,l.filter(x=>x.id!==p.id)); toast('post deleted'); render(); } break; }
    case 'del-comment': { const l=posts(); const p=l.find(x=>x.id===b.dataset.post);
      if(p){ const c=p.comments.find(x=>x.id===b.dataset.cid);
        if(c&&(isAdmin()||c.author===me.username)){ p.comments=p.comments.filter(x=>x.id!==c.id); DB.set(K.posts,l); render(); } } break; }
    case 'open-group': go({name:'group',id:b.dataset.id}); break;
    case 'join': { const l=groups(); const g=l.find(x=>x.id===b.dataset.id);
      if(g){ const i=g.members.indexOf(me.username); i<0?g.members.push(me.username):g.members.splice(i,1); DB.set(K.groups,l); render(); } break; }
    /* lists */
    case 'new-list': listModal='new'; listDraft={name:'',desc:'',rules:'',icon:'⭐',color:0,banner:null}; render(); break;
    case 'edit-list': { const l=lists().find(x=>x.id===b.dataset.id);
      if(l&&canList(l)){ listModal=l.id; listDraft={name:l.name,desc:l.desc||'',rules:l.rules||'',icon:l.icon,color:l.color,banner:l.banner}; render(); } break; }
    case 'go-list': go({name:'listview',slug:b.dataset.slug}); break;
    case 'del-list': { const L=lists(); const l=L.find(x=>x.id===b.dataset.id);
      if(l&&canList(l)){ DB.set(K.lists,L.filter(x=>x.id!==l.id)); toast('list deleted'); go({name:'lists'}); } break; }
    case 'list-tab': listTab=b.dataset.t; render(); break;
    case 'li-icon': syncListDraft(); listDraft.icon=b.dataset.i; render(); break;
    case 'li-color': syncListDraft(); listDraft.color=+b.dataset.i; render(); break;
    case 'li-banner-del': syncListDraft(); listDraft.banner=null; render(); break;
    case 'copy-link': copyText(b.dataset.href); break;
    case 'watch': { const id=ytId(b.dataset.url);
      if(id){ ytModal={title:b.dataset.title||'video',id}; render(); } else window.open(b.dataset.url,'_blank'); break; }
    /* levels */
    case 'new-item': itemModal={list:b.dataset.list,id:null};
      itemDraft={title:'',desc:'',tags:'',points:'',vname:'',vvideo:'',thumb:null,photos:[]}; render(); break;
    case 'edit-item': { const L=lists();
      const l=L.find(x=>x.id===(view.name==='item'?lists().find(y=>y.slug===view.slug)?.id:(view.name==='listview'?L.find(y=>y.slug===view.slug)?.id:null)));
      const it=l&&l.items.find(x=>x.id===b.dataset.id);
      if(l&&it&&canList(l)){ itemModal={list:l.id,id:it.id};
        itemDraft={title:it.title,desc:it.desc||'',tags:(it.tags||[]).join(', '),points:it.points||'',
          vname:(it.verifier||{}).name||'',vvideo:(it.verifier||{}).video||'',thumb:it.thumb,photos:[...(it.photos||[])]};
        render(); } break; }
    case 'go-item': go({name:'item',slug:view.slug,is:b.dataset.slug}); break;
    case 'item-back': go({name:'listview',slug:view.slug}); break;
    case 'del-item': { const ctx=itemCtx(); if(!ctx)break; const L=lists(); const l=L.find(x=>x.id===ctx.list.id);
      if(l&&canList(l)){ l.items=l.items.filter(x=>x.id!==b.dataset.id); l.edited=Date.now(); DB.set(K.lists,L); toast('level deleted'); go({name:'listview',slug:l.slug}); } break; }
    case 'iphoto-del': syncItemDraft(); itemDraft.photos.splice(+b.dataset.i,1); render(); break;
    case 'photo-view': itemPhoto=+b.dataset.i; render(); break;
    case 'del-victor': { const ctx=itemCtx(); if(!ctx)break; const L=lists(); const l=L.find(x=>x.id===ctx.list.id);
      const it=l.items.find(x=>x.id===ctx.item.id);
      if(it&&canList(l)){ it.victors=(it.victors||[]); it.victors.splice(+b.dataset.i,1); it.edited=l.edited=Date.now(); DB.set(K.lists,L); render(); } break; }
    case 'rate': { const ctx=itemCtx(); if(!ctx)break; const L=lists(); const l=L.find(x=>x.id===ctx.list.id);
      const it=l.items.find(x=>x.id===ctx.item.id); it.ratings=it.ratings||{};
      const v=+b.dataset.val; if(it.ratings[me.username]===v) delete it.ratings[me.username]; else it.ratings[me.username]=v;
      DB.set(K.lists,L); render(); break; }
    case 'react': { const ctx=itemCtx(); if(!ctx)break; const L=lists(); const l=L.find(x=>x.id===ctx.list.id);
      const it=l.items.find(x=>x.id===ctx.item.id); it.reacts=it.reacts||{}; const e=b.dataset.e;
      it.reacts[e]=it.reacts[e]||[]; const i=it.reacts[e].indexOf(me.username);
      i<0?it.reacts[e].push(me.username):it.reacts[e].splice(i,1);
      DB.set(K.lists,L); render(); break; }
    case 'del-icomment': { const ctx=itemCtx(); if(!ctx)break; const L=lists(); const l=L.find(x=>x.id===ctx.list.id);
      const it=l.items.find(x=>x.id===b.dataset.iid); if(!it)break;
      const c=it.comments.find(x=>x.id===b.dataset.cid);
      if(c&&(isAdmin()||c.author===me.username)){ it.comments=it.comments.filter(x=>x.id!==c.id); DB.set(K.lists,L); render(); } break; }
    case 'dm': dmWith=b.dataset.user; go({name:'dms'}); break;
    case 'del-user': { if(isAdmin()) deleteUser(b.dataset.user); break; }
  }
});

function deleteUser(name){
  DB.set(K.users, users().filter(u=>u.username!==name));
  DB.set(K.posts, posts().filter(p=>p.author!==name)
    .map(p=>({...p, likes:p.likes.filter(l=>l!==name), comments:p.comments.filter(c=>c.author!==name)})));
  DB.set(K.groups, groups().map(g=>({...g, members:g.members.filter(m=>m!==name)})));
  DB.set(K.dms, dms().filter(t=>!t.members.includes(name)));
  const L=lists().filter(l=>l.author!==name);
  L.forEach(l=>l.items.forEach(it=>{ it.comments=it.comments.filter(c=>c.author!==name);
    Object.values(it.reacts||{}).forEach(arr=>{ let i; while((i=arr.indexOf(name))>-1) arr.splice(i,1); });
    delete (it.ratings||{})[name]; }));
  DB.set(K.lists,L);
  if(dmWith===name) dmWith=null;
  toast('@'+name+' removed from the community'); render();
}

/* ---------- forms ---------- */
function bindForms(){
  const on=(sel,fn)=>{ const el=$(sel); if(el) el.addEventListener('submit',e=>{ e.preventDefault(); fn(el); }); };
  on('#f-login',doLogin); on('#f-signup',doSignup); on('#f-post',doPost);
  on('#f-group-create',doCreateGroup); on('#f-dm',doSendDM); on('#f-bio',doSaveBio);
  on('#f-list',doSaveList); on('#f-item',doSaveItem); on('#f-victor',doAddVictor); on('#f-rules',doSaveRules);
  document.querySelectorAll('form[data-comment]').forEach(f=>
    f.addEventListener('submit',e=>{ e.preventDefault(); doComment(f.dataset.comment,f); }));
  const ic=document.querySelector('form[data-itemcomment]');
  if(ic) ic.addEventListener('submit',e=>{ e.preventDefault(); doItemComment(ic); });
  const af=$('#av-file'); if(af) af.addEventListener('change',onAvatarFile);
  const bf=$('#li-banner-file'); if(bf) bf.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    try{ syncListDraft(); listDraft.banner=await cropImage(file,900,300); render(); }catch{ toast('could not read image','error'); } });
  const tf=$('#it-thumb-file'); if(tf) tf.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    try{ syncItemDraft(); itemDraft.thumb=await cropImage(file,200,200); render(); }catch{ toast('could not read image','error'); } });
  const pf=$('#it-photos-file'); if(pf) pf.addEventListener('change',async e=>{
    const files=[...e.target.files]; if(!files.length)return; syncItemDraft();
    try{ for(const file of files){ if(itemDraft.photos.length>=6){ toast('max 6 photos','error'); break; }
      itemDraft.photos.push(await fitImage(file,800)); } render(); }catch{ toast('could not read image','error'); } });
}

function doLogin(f){
  const u=f.elements.u.value.trim(), p=f.elements.p.value, err=$('#auth-err');
  const usr=findUser(u);
  if(!usr){ err.textContent='no account with that username'; return; }
  if(usr.pass!==hashPw(usr.username,p)){ err.textContent='wrong password'; return; }
  DB.set(K.session,usr.username); go({name:'feed'}); toast('welcome back, '+usr.username+'!');
}
function doSignup(f){
  const u=f.elements.u.value.trim(), p=f.elements.p.value, p2=f.elements.p2.value, err=$('#auth-err');
  if(!/^[a-z0-9_]{3,16}$/i.test(u)){ err.textContent='username: 3–16 letters, numbers or _'; return; }
  if(findUser(u)){ err.textContent='that username is taken'; return; }
  if(p.length<6){ err.textContent='password needs at least 6 characters'; return; }
  if(p!==p2){ err.textContent="passwords don't match"; return; }
  const newUser={username:u,pass:hashPw(u,p),avatar:null,bio:'',joined:Date.now()};
  if(u.toLowerCase()==='myszon') newUser.role='admin';
  DB.set(K.users,[...users(),newUser]);
  DB.set(K.session,u); go({name:'feed'});
  toast(newUser.role?'welcome, admin 👑':'welcome to the community! 🎨');
}
function doPost(f){
  const t=f.elements.t.value.trim(); if(!t) return;
  DB.set(K.posts,[{id:uid(),author:me.username,text:t,ts:Date.now(),likes:[],comments:[],group:f.dataset.group||null},...posts()]);
  render();
}
function doComment(id,f){
  const t=f.elements.c.value.trim(); if(!t) return;
  const l=posts(); const p=l.find(x=>x.id===id); if(!p) return;
  p.comments.push({id:uid(),author:me.username,text:t,ts:Date.now()});
  DB.set(K.posts,l); render();
  const inp=document.querySelector('form[data-comment="'+id+'"] input'); if(inp) inp.focus();
}
function doItemComment(f){
  const ctx=itemCtx(); if(!ctx) return;
  const t=f.elements.c.value.trim(); if(!t) return;
  const L=lists(); const l=L.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
  it.comments.push({id:uid(),author:me.username,text:t,ts:Date.now()});
  it.edited=l.edited=Date.now();
  DB.set(K.lists,L); render();
}
function doCreateGroup(f){
  const name=f.elements.name.value.trim(), desc=f.elements.desc.value.trim();
  if(name.length<3){ toast('group name too short','error'); return; }
  const emojis=['🟩','🟨','🔺','⭐','💠','🌀','👾','🎮','🕹️','🧊','😈','🚀'];
  const g={id:uid(),name,desc,emoji:emojis[Math.floor(Math.random()*emojis.length)],members:[me.username],owner:me.username,ts:Date.now()};
  DB.set(K.groups,[...groups(),g]); go({name:'group',id:g.id}); toast('group created ✓');
}
function doSendDM(f){
  const t=f.elements.t.value.trim(); if(!t||!dmWith) return;
  const tid=[me.username,dmWith].sort().join('|');
  const l=dms(); let th=l.find(x=>x.id===tid);
  if(!th){ th={id:tid,members:[me.username,dmWith],msgs:[]}; l.push(th); }
  th.msgs.push({from:me.username,text:t,ts:Date.now()});
  DB.set(K.dms,l); focusDM=true; render();
}
function doSaveBio(f){ saveUser({bio:f.elements.bio.value.trim()}); toast('profile saved ✓'); profileOpen=false; render(); }
function doSaveRules(f){
  const l0=lists().find(x=>x.slug===view.slug); if(!l0||!canList(l0)) return;
  const L=lists(); const l=L.find(x=>x.id===l0.id);
  l.rules=f.elements.rules.value; l.edited=Date.now();
  DB.set(K.lists,L); toast('rules saved 📋'); render();
}
function doAddVictor(f){
  const ctx=itemCtx(); if(!ctx||!canList(ctx.list)) return;
  const name=f.elements.name.value.trim();
  if(!name){ toast('write who beat it','error'); return; }
  const L=lists(); const l=L.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
  it.victors=it.victors||[];
  it.victors.push({name,video:normUrl(f.elements.video.value)});
  it.edited=l.edited=Date.now();
  DB.set(K.lists,L); toast(name+' added as victor 🏆'); render();
}
function doSaveList(f){
  syncListDraft();
  const name=(listDraft.name||'').trim();
  if(name.length<2){ toast('the list needs a name','error'); return; }
  const desc=(listDraft.desc||'').trim(), rules=listDraft.rules||'';
  const L=lists();
  if(listModal==='new'){
    L.push({id:uid(),slug:uniqueListSlug(name),name,desc,rules,icon:listDraft.icon,color:listDraft.color,banner:listDraft.banner,
      author:me.username,created:Date.now(),edited:Date.now(),items:[]});
    DB.set(K.lists,L); listModal=null; toast('list created ✓');
    go({name:'listview',slug:L[L.length-1].slug}); return;
  }
  const l=L.find(x=>x.id===listModal);
  if(l&&canList(l)){ Object.assign(l,{name,desc,rules,icon:listDraft.icon,color:listDraft.color,banner:listDraft.banner,edited:Date.now()});
    DB.set(K.lists,L); toast('list updated ✓'); }
  listModal=null; render();
}
function doSaveItem(f){
  syncItemDraft();
  const d=itemDraft; if(!d||!itemModal) return;
  const title=(d.title||'').trim();
  if(title.length<2){ toast('the level needs a name','error'); return; }
  const tags=(d.tags||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);
  const points=Math.max(0,Math.min(99999,parseInt(d.points,10)||0));
  const verifier={name:(d.vname||'').trim(),video:normUrl(d.vvideo)};
  const L=lists(); const l=L.find(x=>x.id===itemModal.list); if(!l||!canList(l)) return;
  if(itemModal.id){
    const it=l.items.find(x=>x.id===itemModal.id);
    if(it){ Object.assign(it,{title,desc:d.desc.trim(),tags,points,verifier,thumb:d.thumb,photos:d.photos,edited:Date.now()});
      l.edited=Date.now(); toast('level updated ✓'); }
  } else {
    l.items.push({id:uid(),slug:uniqueItemSlug(l,title),title,desc:d.desc.trim(),tags,points,verifier,
      victors:[],thumb:d.thumb,photos:d.photos,ratings:{},reacts:{},comments:[],
      author:me.username,created:Date.now(),edited:Date.now()});
    l.edited=Date.now(); toast('level added ✓');
  }
  DB.set(K.lists,L); itemModal=null; render();
}
async function onAvatarFile(e){
  const file=e.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('that is not an image','error'); return; }
  if(file.size>8*1024*1024){ toast('image too big (max 8MB)','error'); return; }
  try{ saveUser({avatar:await cropImage(file,144,144)}); toast('avatar updated ✓'); render(); }
  catch{ toast('could not read that image','error'); }
}

window.addEventListener('storage',()=>render());

seed();
view=parseHash();
render();
</script>
