<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD COMMUNITY</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0b62c4; --bg2:#073b83; --deep:#051a35;
    --panel:#0f3560; --panel2:#0a2a50; --edge:#071f3d;
    --green:#8ee85d; --green2:#4db32a; --yellow:#ffd93b; --orange:#ff9f2e; --blue:#5db9ff;
    --text:#fff; --mut:#a9c6e8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Rubik',sans-serif;color:var(--text);min-height:100vh;
    background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%,#062f67);background-attachment:fixed}
  button{font:inherit;cursor:pointer}
  ::selection{background:rgba(255,217,59,.4)}
  .mut{color:var(--mut)} .small{font-size:.8rem}

  .gd-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    font-family:'Titan One';font-size:.9rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
    background:linear-gradient(180deg,var(--green),var(--green2));
    border:3px solid #1d5c10;border-radius:12px;padding:11px 20px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #17490d;transition:transform .1s,filter .15s}
  .gd-btn:hover{filter:brightness(1.08)}
  .gd-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 #17490d}
  .gd-btn.blue{background:linear-gradient(180deg,#5db9ff,#2a7fd4);border-color:#0f3d73;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #0c315c}
  .gd-btn.ghost{background:var(--panel);border-color:var(--edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 4px 0 var(--deep)}
  .gd-btn.small{font-size:.72rem;padding:8px 14px;border-width:2px;border-radius:10px}
  .gd-btn:disabled{opacity:.4;pointer-events:none}

  .panel{background:var(--panel);border:2px solid var(--edge);border-radius:14px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 4px 0 rgba(0,0,0,.22)}
  .inp,textarea.inp,select.inp{width:100%;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;
    color:#fff;padding:11px 13px;font:inherit;font-size:.95rem;outline:none;transition:border-color .15s}
  .inp:focus{border-color:var(--blue)}
  .inp::placeholder,textarea.inp::placeholder{color:#5f7ea6}
  textarea.inp{resize:vertical}

  .av,.cube{display:inline-block;flex:none;border-radius:18%}
  .av{object-fit:cover;border:2px solid rgba(0,0,0,.35)}
  .cube{position:relative;background:linear-gradient(180deg,var(--c1),var(--c2));
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.25)}
  .cube i,.cube em{position:absolute;background:#102540;border-radius:2px}
  .cube i{top:26%;width:16%;height:26%}
  .cube i:first-child{left:22%} .cube i:nth-child(2){right:22%}
  .cube em{left:30%;right:30%;bottom:18%;height:12%}
  .s28{width:28px;height:28px} .s30{width:30px;height:30px} .s44{width:44px;height:44px}
  .s64{width:64px;height:64px} .s72{width:72px;height:72px} .s96{width:96px;height:96px}
  .admintag{display:inline-block;background:#ffd93b;color:#3d2c00;
    font-size:.58rem;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:6px;margin-left:7px;vertical-align:middle}
  .ogtag{display:inline-block;background:#5db9ff;color:#062a3a;
    font-size:.58rem;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:6px;margin-left:7px;vertical-align:middle}
  .uname{background:none;border:none;padding:0;font:inherit;font-weight:700;color:#fff;cursor:pointer}
  .uname:hover{text-decoration:underline}
  .top-btn{font-family:'Titan One';font-size:.68rem;padding:9px 12px;border-radius:10px;border:2px solid var(--edge);background:var(--panel);color:var(--mut);transition:.15s;display:inline-flex;align-items:center}
  .top-btn:hover{color:#fff;border-color:#1c4f92}
  .badge-n{background:#ffd93b;color:#3d2c00;border-radius:99px;font-size:.6rem;font-weight:700;padding:2px 6px;margin-left:6px}
  .badge-n.red{background:#ff7a6b;color:#3a0d0d}

  /* ACHIEVEMENTS */
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .ach{padding:10px 6px;border-radius:10px;background:var(--panel2);border:2px solid var(--edge);text-align:center;font-size:.66rem;color:var(--mut);line-height:1.3}
  .ach .ic{font-size:1.35rem;display:block;margin-bottom:6px}
  .ach.got{border-color:var(--yellow);color:#fff;background:rgba(255,217,59,.08)}
  .ach:not(.got){opacity:.4}
  .ach-mini{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:1.05rem}
  .ach-mini span{cursor:default}

  /* AUTH */
  .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:30px 18px}
  .logo-big{text-align:center}
  .logo-big h1{font-family:'Titan One';font-size:clamp(2rem,6vw,3.1rem);text-shadow:0 4px 0 rgba(0,0,0,.3);margin-top:14px}
  .logo-big h1 span{color:var(--yellow)}
  .logo-big p{margin-top:6px}
  .auth-card{width:min(400px,100%);padding:24px}
  .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .aform label{display:block;font-size:.66rem;letter-spacing:.2em;color:var(--mut);font-weight:700;margin:14px 0 6px}
  .form-err{color:#ff9090;min-height:22px;font-size:.88rem;margin-top:8px;text-align:center}

  /* TOPBAR */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px clamp(14px,3vw,28px);background:#0a2c55;border-bottom:3px solid var(--deep);box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .logo{font-family:'Titan One';font-size:1.1rem;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.35)}
  .logo span{color:var(--green)}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav button{font-family:'Titan One';font-size:.74rem;padding:9px 14px;border-radius:10px;border:2px solid transparent;background:transparent;color:#bcd6f2;transition:.15s}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.active{background:#1c4f92;border-color:#0d3568;color:#fff}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:8px;background:none;border:none;color:#fff;font-weight:700;padding:4px 10px;border-radius:10px;transition:.15s}
  .chip:hover{background:rgba(255,255,255,.08)}

  .wrap{max-width:1000px;margin:0 auto;padding:22px clamp(14px,3vw,28px) 70px}
  .page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{font-family:'Titan One';font-size:1.4rem;text-shadow:0 2px 0 rgba(0,0,0,.3)}

  /* FEED */
  .cols{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
  .side-wrap{display:flex;flex-direction:column;gap:18px;position:sticky;top:78px}
  .side-card{padding:20px;text-align:center}
  .side-card h3{margin-top:10px;font-size:1.05rem}
  .side-card .bio{margin-top:8px;font-size:.88rem;color:var(--mut);min-height:1em;word-break:break-word}
  .stats{display:flex;gap:8px;margin:16px 0}
  .stats div{flex:1;background:var(--panel2);border-radius:10px;padding:9px 4px}
  .stats b{display:block;color:var(--yellow);font-size:1.02rem}
  .stats span{font-size:.6rem;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
  .rec-row{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.85rem;flex-wrap:wrap;transition:.15s}
  .rec-row:hover{background:rgba(255,255,255,.07)}
  .composer{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px}
  .composer .stack{display:flex;flex-direction:column;gap:10px}
  .composer .row{display:flex;justify-content:flex-end;align-items:center;gap:10px}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap}
  .ttag{cursor:pointer;border:none;transition:.15s}
  .ttag:hover{background:#2663b3}
  .ttag.sel{background:#ffd93b;color:#3d2c00}
  .clicktag{cursor:pointer;border:none}
  .clicktag:hover{background:#2663b3}
  .searchbar{display:flex;align-items:center;gap:10px;padding:6px 14px;margin-bottom:14px}
  .searchbar input{flex:1;background:transparent;border:none;color:#fff;font:inherit;font-size:.95rem;outline:none}
  .searchbar input::placeholder{color:#5f7ea6}
  .ftabs{display:flex;gap:8px;margin-bottom:12px}
  .ftab{font-family:'Titan One';font-size:.7rem;padding:8px 14px;border-radius:10px;border:2px solid var(--edge);background:var(--panel);color:var(--mut);transition:.15s}
  .ftab:hover{color:#fff}
  .ftab.active{background:#1c4f92;color:#fff;border-color:#0d3568}
  .feed-list{display:flex;flex-direction:column;gap:14px}
  .post{padding:16px}
  .post-head{display:flex;gap:11px;align-items:center}
  .post-head .who span{font-size:.78rem;color:var(--mut);display:block}
  .gtag{margin-left:auto;font-size:.72rem;background:#1c4f92;border:1px solid #0d3568;color:#cfe3fa;border-radius:99px;padding:4px 11px;white-space:nowrap}
  .gtag:hover{background:#2663b3}
  .post-text{margin-top:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:.96rem}
  .post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .post-actions{display:flex;gap:6px;align-items:center;margin-top:11px;border-top:1px solid rgba(255,255,255,.07);padding-top:9px}
  .act{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-size:.9rem;padding:6px 11px;border-radius:8px;transition:.15s}
  .act:hover{background:rgba(255,255,255,.08);color:#fff}
  .act.liked{color:var(--yellow)}
  .del{background:none;border:none;color:#6c88ab;font-size:.78rem;padding:5px 9px;border-radius:8px;transition:.15s}
  .del:hover{color:#ff8a8a;background:rgba(255,90,90,.12)}
  .comments{margin-top:10px}
  .cmt{display:flex;gap:9px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:.9rem;align-items:flex-start}
  .cmt .mut{font-size:.74rem}
  .cmt-body{min-width:0;word-break:break-word}
  .cmt .del{margin-left:auto}
  .cmt-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .cmt-form .inp{flex:1;min-width:120px}
  .empty{padding:30px;text-align:center;color:var(--mut)}

  /* ATTACHMENTS */
  .clip{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--edge);border-radius:10px;background:var(--panel2);cursor:pointer;font-size:1rem;flex:none;transition:.15s}
  .clip:hover{border-color:var(--blue)}
  .attach-strip{display:flex;gap:8px;flex-wrap:wrap}
  .attach-strip:empty{display:none}
  .att-chip{position:relative;display:inline-block}
  .att-chip img{width:46px;height:46px;object-fit:cover;border-radius:8px;border:2px solid var(--edge)}
  .att-chip.file{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:8px 28px 8px 10px;font-size:.74rem;color:var(--blue);max-width:210px}
  .att-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .atts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .att-img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:2px solid var(--edge);cursor:pointer;transition:transform .15s}
  .att-img:hover{transform:scale(1.04)}
  .att-file{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:7px 11px;font-size:.76rem;color:var(--blue);text-decoration:none;max-width:230px}
  .att-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bub .atts{margin-top:8px}
  .bub .att-img{width:140px;height:140px}

  /* GROUPS */
  .g-create{display:flex;gap:10px;padding:14px;flex-wrap:wrap;margin-bottom:16px}
  .g-create .inp{flex:1;min-width:140px}
  .g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
  .g-card{padding:16px;cursor:pointer;transition:transform .15s}
  .g-card:hover{transform:translateY(-3px)}
  .g-card .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .g-emoji{font-size:1.9rem}
  .g-card h4{font-size:1rem}
  .g-card p{font-size:.85rem;color:var(--mut);margin:6px 0 10px;min-height:2.5em}
  .g-foot{display:flex;align-items:center;justify-content:space-between}
  .g-head{display:flex;gap:16px;align-items:center;padding:18px;margin-bottom:16px;flex-wrap:wrap}
  .g-head .g-emoji{font-size:3rem}
  .g-head .info{flex:1;min-width:180px}
  .g-head h2{font-family:'Titan One';font-size:1.3rem}
  .g-head p{color:var(--mut);font-size:.9rem;margin-top:3px}

  /* LISTS */
  .l-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-top:6px}
  .l-card{cursor:pointer;overflow:hidden;transition:transform .15s}
  .l-card:hover{transform:translateY(-3px)}
  .lc-banner{height:92px;background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font-size:2.2rem}
  .lc-icon{position:absolute;left:14px;bottom:-17px;width:46px;height:46px;border-radius:12px;background:var(--panel2);border:2px solid var(--edge);display:grid;place-items:center;font-size:1.4rem;overflow:hidden}
  .lc-icon img{width:100%;height:100%;object-fit:cover}
  .lc-body{padding:24px 16px 16px}
  .lc-body h4{font-family:'Titan One';font-size:1rem}
  .lc-body p{font-size:.85rem;color:var(--mut);margin:6px 0 10px;min-height:2.4em;word-break:break-word}
  .lc-meta{font-size:.72rem;color:var(--mut);line-height:1.5}
  .pick-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .icon-pick{width:36px;height:36px;border-radius:9px;border:2px solid var(--edge);background:var(--panel2);font-size:18px;display:grid;place-items:center;transition:.15s}
  .icon-pick:hover{transform:scale(1.08)}
  .icon-pick.sel{border-color:var(--yellow);background:rgba(255,217,59,.14)}
  .color-pick{width:34px;height:34px;border-radius:9px;border:2px solid rgba(255,255,255,.18);transition:.15s}
  .color-pick:hover{transform:scale(1.1)}
  .color-pick.sel{box-shadow:0 0 0 2px var(--deep),0 0 0 4px #fff}
  .banprev{height:86px;border-radius:10px;background-size:cover;background-position:center;border:2px dashed var(--edge);display:grid;place-items:center;color:var(--mut);font-size:.8rem;margin-top:8px}
  .m-label{font-size:.64rem;letter-spacing:.2em;color:var(--mut);font-weight:700;margin:14px 0 6px;display:block}
  .tagchip{background:#1c4f92;border-radius:99px;padding:3px 10px;font-size:.72rem;color:#cfe3fa;white-space:nowrap;display:inline-block}
  .lv-banner{height:150px;border-radius:12px 12px 0 0;background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font-size:3rem}
  .lv-icon{position:absolute;left:20px;bottom:-22px;width:60px;height:60px;border-radius:14px;background:var(--panel2);border:2px solid var(--edge);display:grid;place-items:center;font-size:1.9rem;overflow:hidden}
  .lv-icon img{width:100%;height:100%;object-fit:cover}
  .lv-head{padding:34px 20px 18px}
  .lv-head h2{font-family:'Titan One';font-size:1.5rem}
  .lv-head .desc{color:var(--mut);margin-top:6px;word-break:break-word}
  .lv-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.78rem;color:var(--mut)}
  .ltabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
  .ltab{font-family:'Titan One';font-size:.78rem;padding:9px 18px;border-radius:10px;border:2px solid var(--edge);background:var(--panel);color:var(--mut);transition:.15s}
  .ltab:hover{color:#fff}
  .ltab.active{background:#1c4f92;color:#fff;border-color:#0d3568}

  /* LEVEL ROWS */
  .dlist{display:flex;flex-direction:column;gap:12px}
  .drow{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;transition:transform .15s}
  .drow:hover{transform:translateX(4px)}
  .drow.open{border-radius:14px 14px 0 0;transform:none}
  .drank{font-family:'Titan One';font-size:1.45rem;min-width:62px;color:#7d9cc4;text-shadow:0 2px 0 rgba(0,0,0,.3);text-align:center}
  .drank.r1{color:#ffd93b} .drank.r2{color:#d5dee8} .drank.r3{color:#e8a06a}
  .dthumb{width:96px;height:54px;object-fit:cover;border-radius:8px;border:2px solid var(--edge);flex:none}
  .dthumb-ph{width:96px;height:54px;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;background:var(--panel2);font-size:1.3rem;flex:none}
  .dmain{flex:1;min-width:0}
  .dmain h4{font-family:'Titan One';font-size:1.02rem;word-break:break-word}
  .dmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--mut);margin-top:4px}
  .dside{display:flex;gap:10px;align-items:center;flex:none}
  .chev{color:var(--mut);font-size:.7rem}
  .dexp{padding:16px;margin-top:-8px;border-radius:0 0 14px 14px;position:relative}
  .ddesc{line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
  .i-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .dphotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .dphotos img{height:80px;border-radius:8px;border:2px solid var(--edge);cursor:pointer;transition:transform .15s}
  .dphotos img:hover{transform:scale(1.05)}
  .dtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .vrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;margin-top:8px;flex-wrap:wrap}
  .rate-star{background:none;border:none;font-size:1.35rem;color:#3f5f8d;padding:2px;transition:transform .1s}
  .rate-star:hover{transform:scale(1.15)}
  .rate-star.on{color:var(--yellow)}
  .react-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--edge);border-radius:99px;padding:6px 12px;font-size:.9rem;color:#fff;transition:.15s}
  .react-btn:hover{border-color:#1c4f92;background:#1c4f92}
  .react-btn.sel{border-color:var(--green);background:rgba(142,232,93,.14)}
  .f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#b23b3b;color:#fff;border:none;font-size:.6rem;display:grid;place-items:center}
  .lf-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .sep{border:none;border-top:2px dashed var(--edge);margin:18px 0}

  /* LEADERBOARD */
  .lb-row{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-bottom:12px;flex-wrap:wrap}
  .rank{font-family:'Titan One';width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem;background:#1c4f92;border:2px solid #0d3568;flex:none;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .rank.r1{background:linear-gradient(180deg,#ffe45e,#e0a013);border-color:#8a6206;color:#3d2c00;text-shadow:none}
  .rank.r2{background:linear-gradient(180deg,#e8eef4,#9fb2c4);border-color:#5d6f80;color:#22303d;text-shadow:none}
  .rank.r3{background:linear-gradient(180deg,#e8a06a,#b0642e);border-color:#6e3d17;color:#3a2008;text-shadow:none}
  .lb-name{flex:1;min-width:170px}
  .lb-name b{font-size:1rem}
  .lb-clears{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .lb-pts{font-family:'Titan One';color:var(--yellow);font-size:1.15rem;margin-left:auto}

  /* DMS */
  .dms{display:grid;grid-template-columns:230px 1fr;gap:14px;height:calc(100vh - 160px);min-height:430px}
  .dm-list{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .dm-user{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer;color:#fff;font-weight:500;transition:.15s}
  .dm-user:hover{background:rgba(255,255,255,.08)}

/* ---- SMART SEARCH ---- */
const STOP=new Set(['i','a','an','the','some','my','me','to','of','in','on','for','and','or','is','it','at','u','ur','plz','please','with','that','this','have','has','do','does','can','you','your']);
function tokenize(s){ return String(s).toLowerCase().split(/[^a-z0-9ąćęłńóśźż]+/).filter(w=>w.length>1); }
function editDist(a,b){
  if(Math.abs(a.length-b.length)>2) return 99;
  const m=a.length,n=b.length;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function wordScore(w,t){
  if(w===t) return 3;
  if(t.length>=3&&w.startsWith(t)) return 2;
  if(t.length>=3&&w.includes(t)) return 2;
  if(t.length>=4){
    const allow=t.length>=8?2:1;
    const d=Math.min(editDist(w,t),editDist(w.slice(0,t.length+1),t));
    if(d<=allow) return 1;
  }
  return 0;
}
function docScore(words,tokens){
  let s=0;
  for(const t of tokens){
    if(STOP.has(t)) continue;
    let best=0;
    for(const w of words){ const sc=wordScore(w,t); if(sc>best){ best=sc; if(best===3)break; } }
    s+=best;
  }
  return s;
}

function toHash(v){
  switch(v.name){
    case 'groups': return '#/groups';
    case 'group': return '#/group/'+v.id;
    case 'lists': return '#/lists';
    case 'listview': return '#/lista/'+v.slug;
    case 'sites': return '#/websites';
    case 'olists': return '#/other-lists';
    case 'dms': return '#/dms';
    default: return '#/feed';
  }
}
function parseHash(){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(parts[0]==='lista'&&parts[1]) return {name:'listview',slug:parts[1],expand:parts[2]||null};
  if(['feed','groups','lists','dms','websites'].includes(parts[0])) return {name:parts[0]==='websites'?'sites':parts[0]};
  if(parts[0]==='other-lists') return {name:'olists'};
  if(parts[0]==='group'&&parts[1]) return {name:'group',id:parts[1]};
  return {name:'feed'};
}

function toast(msg,type){ const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg;

/* ---------- attachments ---------- */
function attsHTML(atts){
  if(!atts||!atts.length) return '';
  return `<div class="atts">${atts.map(a=> a.kind==='img'
    ? `<img class="att-img" src="${a.data}" data-act="view-img" data-src="${a.data}">`
    : `<a class="att-file" href="${a.data}" download="${esc(a.name)}">📄 <span>${esc(a.name)}</span></a>`).join('')}</div>`;
}
function stripHTML(key){
  const arr=attach[key]||[];
  return arr.map((a,i)=> a.kind==='img'
    ? `<span class="att-chip"><img src="${a.data}"><button type="button" class="ph-x" data-act="attach-del" data-key="${key}" data-i="${i}">✕</button></span>`
    : `<span class="att-chip file">📄<span class="att-name">${esc(a.name)}</span><button type="button" class="ph-x" data-act="attach-del" data-key="${key}" data-i="${i}">✕</button></span>`).join('');
}
function updateStrip(key){ const el=document.querySelector('.attach-strip[data-key="'+key+'"]'); if(el) el.innerHTML=stripHTML(key); }
async function onAttach(key,fileList){
  const files=[...fileList]; if(!files.length) return;
  attach[key]=attach[key]||[];
  for(const f of files){
    if(attach[key].length>=6){ toast('max 6 attachments','error'); break; }
    if(f.type.startsWith('image/')){
      try{ attach[key].push({kind:'img',name:f.name,data:await fitImage(f,800)}); }catch{ toast('could not read image','error'); }
    } else if(f.size<=1000000){
      attach[key].push({kind:'file',name:f.name,data:await fileToData(f)});
    } else toast('file too big (max 1MB) — images get compressed','error');
  }
  updateStrip(key);
}
document.addEventListener('change',e=>{
  const inp=e.target.closest?e.target.closest('input[data-attach]'):null;
  if(inp){ onAttach(inp.dataset.attach,inp.files); inp.value=''; }
});

/* ---------- per-list leaderboard ---------- */
function listLeaderboard(l){
  const map={};
  const add=(name,pts,entry)=>{ if(!name)return; const k=name.toLowerCase();
    map[k]=map[k]||{name,pts:0,clears:[]}; map[k].pts+=pts; map[k].clears.push(entry); };
  l.items.forEach(it=>{
    const pts=+it.points||0;
    if(it.verifier&&it.verifier.name) add(it.verifier.name,pts,{level:it.title,pts,role:'verifier'});
    (it.victors||[]).forEach(v=>add(v.name,pts,{level:it.title,pts,role:'victor'}));
  });
  return Object.values(map).sort((a,b)=>b.pts-a.pts);
}

function feedPostsHTML(){
  const q=feedQ.trim();
  let list=posts().filter(p=>!p.group).sort((a,b)=>b.ts-a.ts);
  if(feedFilter==='following'){
    const allowed=new Set([me.username,...(followsMap()[me.username]||[])]);
    list=list.filter(p=>allowed.has(p.author));
  }
  if(q){
    const ql=q.toLowerCase();
    const tokens=tokenize(ql);
    const exact=list.some(p=>(p.text+' '+p.author+' '+(p.tags||[]).join(' ')).toLowerCase().includes(ql));
    const scored=list.map(p=>{
      const words=[...tokenize(p.text),...tokenize(p.author),...(p.tags||[]).map(t=>String(t).toLowerCase())];
      return {p,s:docScore(words,tokens)};
    }).filter(x=>x.s>0).sort((a,b)=> b.s-a.s || b.p.ts-a.p.ts);
    list=scored.map(x=>x.p);
    if(!list.length) return `<div class="panel empty">no results for “${esc(q)}”</div>`;
    return (exact?'':`<div class="mut small" style="padding:0 4px 10px">no exact match — showing similar results</div>`)+list.map(postHTML).join('');
  }
  if(!list.length) return `<div class="panel empty">${feedFilter==='following'?'posts from people you follow will appear here':'no posts yet'}</div>`;
  return list.map(postHTML).join('');
}

/* one ranked level row */
function drowHTML(l,it,i,can){
  const pts=+it.points||0;
  const rates=Object.values(it.ratings||{});
  const avg=rates.length?(rates.reduce((a,b)=>a+b,0)/rates.length).toFixed(1):null;
  const victors=it.victors||[];
  const open=openLevel===it.slug;
  const rc=i===0?'r1':i===1?'r2':i===2?'r3':'';
  const link=location.href.split('#')[0]+'#/lista/'+l.slug+'/'+it.slug;
  const mine=(it.ratings||{})[me.username]||0;
  return `<div>
    <div class="panel drow ${open?'open':''}" data-act="lvl-toggle" data-slug="${esc(it.slug)}">
      <div class="drank ${rc}">#${i+1}</div>
      ${it.thumb?`<img class="dthumb" src="${it.thumb}">`:`<div class="dthumb-ph">🎮</div>`}
      <div class="dmain">
        <h4>${esc(it.title)}</h4>
        <div class="dmeta">
          <span style="color:var(--yellow)">${pts} pts</span>

          <span>${victors.length} victor${victors.length===1?'':'s'}</span>
          ${avg?`<span style="color:var(--yellow)">★ ${avg}</span>`:''}
        </div>
      </div>
      <div class="dside">
        ${it.verifier&&it.verifier.video?`<button class="gd-btn blue small" data-act="watch" data-url="${esc(it.verifier.video)}" data-title="${esc(it.verifier.name)} verifies ${esc(it.title)}">▶ VIDEO</button>`:''}
        <span class="chev">${open?'▲':'▼'}</span>
      </div>
    </div>
    ${open?`<div class="panel dexp">
      ${it.desc?`<p class="ddesc">${esc(it.desc)}</p>`:''}
      ${(it.tags&&it.tags.length)?`<div class="i-meta" style="margin-top:0">${it.tags.map(t=>`<span class="tagchip">#${esc(t)}</span>`).join('')}</div>`:''}

      <div style="margin-top:12px">

        <div class="vrow">
          ${it.verifier&&it.verifier.name?`${avatarByName(it.verifier.name,'s30')}<button class="uname" data-act="profile-view" data-user="${esc(it.verifier.name)}">${esc(it.verifier.name)}</button>
            ${it.verifier.video?`<button class="gd-btn blue small" style="margin-left:auto" data-act="watch" data-url="${esc(it.verifier.video)}" data-title="${esc(it.verifier.name)} verifies ${esc(it.title)}">▶ VIDEO</button>`:''}`
          :'<span class="mut small">not set yet</span>'}
        </div>
      </div>
      <div style="margin-top:14px">
        <span class="mut small">RECORDS (${victors.length})</span>
        ${victors.map((v,vi)=> (editingVictor && editingVictor.slug===it.slug && editingVictor.i===vi) ? `
          <div class="vrow">

/* ---------- actions ---------- */
function closeModal(){
  if(ytModal){ ytModal=null; render(); return; }
  if(imgModal){ imgModal=null; render(); return; }
  if(notifsOpen){ notifsOpen=false; render(); return; }
  if(reportsOpen){ reportsOpen=false; render(); return; }
  if(profileView!==null){ profileView=null; render(); return; }
  if(listModal!==null) listModal=null;
  else if(itemModal) itemModal=null;
  else settingsOpen=false;

}
function syncListDraft(){ const f=$('#f-list'); if(f&&listDraft){ listDraft.name=f.elements.name.value; listDraft.desc=f.elements.desc.value; listDraft.rules=f.elements.rules.value; listDraft.discord=f.elements.discord.value; } }
function syncItemDraft(){ const f=$('#f-item'); if(f&&itemDraft){ itemDraft.title=f.elements.title.value; itemDraft.desc=f.elements.desc.value;
  itemDraft.tags=f.elements.tags.value; itemDraft.points=f.elements.points.value;

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='m-close' && e.target.closest('.modal')) return;
  switch(act){
    case 'auth-tab': authTab=b.dataset.tab; render(); break;
    case 'nav': go({name:b.dataset.view}); break;
    case 'nav-go': go({name:b.dataset.to}); break;
    case 'logout': DB.set(K.session,null); settingsOpen=false; profileView=null; notifsOpen=false; reportsOpen=false; listModal=null; itemModal=null; ytModal=null; imgModal=null; dmWith=null; editingVictor=null; openComments.clear(); location.hash='#/feed'; render(); break;
    case 'settings': settingsOpen=true; render(); break;
    case 'm-close': case 'm-close-btn': closeModal(); break;
    case 'remove-photo': saveUser({avatar:null}); toast('photo removed'); render(); break;
    case 'view-img': imgModal={src:b.dataset.src}; render(); break;
    case 'attach-del': { const k=b.dataset.key; if(attach[k]){ attach[k].splice(+b.dataset.i,1); updateStrip(k); } break; }
    case 'ptag': { const t=b.dataset.t; const i=postTags.indexOf(t); i<0?postTags.push(t):postTags.splice(i,1); b.classList.toggle('sel'); break; }
    case 'ftag': { feedQ=b.dataset.t;
      if(view.name!=='feed'){ go({name:'feed'}); }
      else { const fs=$('#feed-search'); if(fs)fs.value=feedQ; const el=$('#feed-list'); if(el) el.innerHTML=feedPostsHTML(); } break; }
    case 'feed-filter': feedFilter=b.dataset.f; render(); break;
    case 'go-record': location.hash='#/lista/'+b.dataset.slug+'/'+b.dataset.lv; break;
    /* profiles / follows / notifs / reports */
    case 'profile-view': notifsOpen=false; profileView=b.dataset.user; render(); break;
    case 'plist-open': profileView=null; go({name:'listview',slug:b.dataset.slug}); break;
    case 'prof-dm': dmWith=profileView; profileView=null; go({name:'dms'}); break;
    case 'follow': { const t=b.dataset.user; if(t===me.username)break;
      const f=followsMap(); const arr=f[me.username]||[]; const i=arr.indexOf(t);
      if(i<0){ arr.push(t); notify(t,{type:'follow',from:me.username}); toast('following @'+t); }
      else { arr.splice(i,1); toast('unfollowed @'+t); }
      f[me.username]=arr; DB.set(K.follows,f); render(); break; }
    case 'notifs': { const all=DB.get(K.notifs,{}); const list=all[me.username]||[];
      list.forEach(n=>n.read=true); all[me.username]=list; DB.set(K.notifs,all); notifsOpen=true; render(); break; }
    case 'open-reports': reportsOpen=true; render(); break;
    case 'report-post': { const p=posts().find(x=>x.id===b.dataset.id);
      if(p) makeReport('post',p.id,null,p.author,p.text); break; }
    case 'report-comment': { const p=posts().find(x=>x.id===b.dataset.post); const c=p&&p.comments.find(x=>x.id===b.dataset.cid);
      if(c) makeReport('comment',c.id,p.id,c.author,c.text); break; }
    case 'report-lcomment': { const l=lists().find(x=>x.slug===view.slug); const c=l&&(l.comments||[]).find(x=>x.id===b.dataset.cid);
      if(c) makeReport('list comment',c.id,null,c.author,c.text); break; }
    case 'rep-dismiss': { const reps=DB.get(K.reports,[]); const r=reps.find(x=>x.id===b.dataset.id);
      if(r){ r.status='resolved'; DB.set(K.reports,reps); render(); } break; }
    case 'rep-delete': { const reps=DB.get(K.reports,[]); const r=reps.find(x=>x.id===b.dataset.id);
      if(r){
        if(r.type==='post'){ DB.set(K.posts,posts().filter(p=>p.id!==r.targetId)); }
        else if(r.type==='comment'){ const L=posts(); const p=L.find(x=>x.id===r.postId);
          if(p){ p.comments=p.comments.filter(c=>c.id!==r.targetId); DB.set(K.posts,L); } }
        else { const L=lists(); L.forEach(l=>{ l.comments=(l.comments||[]).filter(c=>c.id!==r.targetId); }); DB.set(K.lists,L); }
        r.status='resolved'; DB.set(K.reports,reps); toast('content deleted'); render();
      } break; }
    /* feed */
    case 'like': { const l=posts(); const p=l.find(x=>x.id===b.dataset.id);
      if(p){ const i=p.likes.indexOf(me.username); i<0?p.likes.push(me.username):p.likes.splice(i,1); DB.set(K.posts,l); render(); } break; }
    case 'comments': { const id=b.dataset.id; openComments.has(id)?openComments.delete(id):openComments.add(id); render(); break; }
    case 'del-post': { const l=posts(); const p=l.find(x=>x.id===b.dataset.id);
      if(p&&(isAdmin()||p.author===me.username)){ DB.set(K.posts,l.filter(x=>x.id!==p.id)); toast('post deleted'); render(); } break; }
    case 'del-comment': { const l=posts(); const p=l.find(x=>x.id===b.dataset.post);
      if(p){ const c=p.comments.find(x=>x.id===b.dataset.cid);
        if(c&&(isAdmin()||c.author===me.username)){ p.comments=p.comments.filter(x=>x.id!==c.id); DB.set(K.posts,l); render(); } } break; }
    case 'open-group': go({name:'group',id:b.dataset.id}); break;
    case 'join': { const l=groups(); const g=l.find(x=>x.id===b.dataset.id);
      if(g){ const i=g.members.indexOf(me.username); i<0?g.members.push(me.username):g.members.splice(i,1); DB.set(K.groups,l); render(); } break; }
    case 'new-list': listModal='new'; listDraft={name:'',desc:'',rules:'',discord:'',icon:'⭐',iconImg:null,color:0,banner:null}; render(); break;
    case 'edit-list': { const l=lists().find(x=>x.id===b.dataset.id);
      if(l&&canList(l)){ listModal=l.id; listDraft={name:l.name,desc:l.desc||'',rules:l.rules||'',discord:l.discord||'',icon:l.icon,iconImg:l.iconImg||null,color:l.color,banner:l.banner}; render(); } break; }
    case 'go-list': go({name:'listview',slug:b.dataset.slug}); break;
    case 'del-list': { const L=lists(); const l=L.find(x=>x.id===b.dataset.id);
      if(l&&canList(l)){ DB.set(K.lists,L.filter(x=>x.id!==l.id)); toast('list deleted'); go({name:'lists'}); } break; }
    case 'list-tab': listTab=b.dataset.t; render(); break;
    case 'li-icon': syncListDraft(); listDraft.icon=b.dataset.i; listDraft.iconImg=null; render(); break;
    case 'li-icon-del': syncListDraft(); listDraft.iconImg=null; render(); break;
    case 'li-color': syncListDraft(); listDraft.color=+b.dataset.i; render(); break;
    case 'li-banner-del': syncListDraft(); listDraft.banner=null; render(); break;
    case 'copy-link': copyText(b.dataset.href); break;
    case 'watch': { const id=ytId(b.dataset.url);
      if(id){ ytModal={title:b.dataset.title||'video',id}; render(); } else window.open(b.dataset.url,'_blank'); break; }
    case 'lreact': { const L=lists(); const l=L.find(x=>x.slug===view.slug); if(!l)break;
      l.reacts=l.reacts||{}; const e2=b.dataset.e; l.reacts[e2]=l.reacts[e2]||[];
      const i=l.reacts[e2].indexOf(me.username); i<0?l.reacts[e2].push(me.username):l.reacts[e2].splice(i,1);
      DB.set(K.lists,L); render(); break; }
    case 'del-lcomment': { const L=lists(); const l=L.find(x=>x.slug===view.slug); if(!l)break;
      l.comments=l.comments||[]; const c=l.comments.find(x=>x.id===b.dataset.cid);
      if(c&&(isAdmin()||c.author===me.username)){ l.comments=l.comments.filter(x=>x.id!==c.id); DB.set(K.lists,L); render(); } break; }
    /* levels */
    case 'lvl-toggle': { const s=b.dataset.slug; openLevel=openLevel===s?null:s; editingVictor=null; render(); break; }
    case 'lvl-up': case 'lvl-down': { const L=lists(); const l=L.find(x=>x.slug===view.slug);
      if(l&&canList(l)){ const i=l.items.findIndex(x=>x.slug===b.dataset.slug); const j=act==='lvl-up'?i-1:i+1;
        if(i>-1&&j>-1&&j<l.items.length){ [l.items[i],l.items[j]]=[l.items[j],l.items[i]]; l.edited=Date.now(); DB.set(K.lists,L); render(); } } break; }
    case 'new-item': itemModal={list:b.dataset.list,id:null};
      itemDraft={title:'',desc:'',tags:'',points:'',vname:'',vvideo:'',thumb:null,photos:[]}; render(); break;
    case 'edit-item': { const l=lists().find(x=>x.slug===view.slug);
      const it=l&&l.items.find(x=>x.id===b.dataset.id);
      if(l&&it&&canList(l)){ itemModal={list:l.id,id:it.id};
        itemDraft={title:it.title,desc:it.desc||'',tags:(it.tags||[]).join(', '),points:it.points||'',
          vname:(it.verifier||{}).name||'',vvideo:(it.verifier||{}).video||'',thumb:it.thumb,photos:[...(it.photos||[])]};
        render(); } break; }
    case 'del-item': { const l0=lists().find(x=>x.slug===view.slug); if(!l0)break;
      const L=lists(); const l=L.find(x=>x.id===l0.id);
      if(l&&canList(l)){ l.items=l.items.filter(x=>x.id!==b.dataset.id); l.edited=Date.now(); openLevel=null; editingVictor=null; DB.set(K.lists,L); toast('level deleted'); render(); } break; }
    case 'iphoto-del': syncItemDraft(); itemDraft.photos.splice(+b.dataset.i,1); render(); break;
    case 'vic-edit': editingVictor={slug:openLevel,i:+b.dataset.i}; render(); break;
    case 'vic-cancel': editingVictor=null; render(); break;
    case 'vic-save': { const ctx=levelCtx(); if(!ctx||!editingVictor)break;
      const name=$('#vic-name').value.trim(), video=normUrl($('#vic-video').value);
      if(!name){ toast("victor name can't be empty",'error'); break; }
      const L=lists(); const l=L.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
      const v=(it.victors||[])[editingVictor.i];
      if(v){ v.name=name; v.video=video; it.edited=l.edited=Date.now(); DB.set(K.lists,L); toast('victor updated'); }
      editingVictor=null; render(); break; }
    case 'del-victor': { const ctx=levelCtx(); if(!ctx)break; const L=lists(); const l=L.find(x=>x.id===ctx.list.id);
      const it=l.items.find(x=>x.id===ctx.item.id);
      if(it&&canList(l)){ it.victors=(it.victors||[]); it.victors.splice(+b.dataset.i,1); it.edited=l.edited=Date.now(); DB.set(K.lists,L); render(); } break; }
    case 'rate': { const ctx=levelCtx(); if(!ctx)break; const L=lists(); const l=L.find(x=>x.id===ctx.list.id);
      const it=l.items.find(x=>x.id===ctx.item.id); it.ratings=it.ratings||{};
      const v=+b.dataset.val; if(it.ratings[me.username]===v) delete it.ratings[me.username]; else it.ratings[me.username]=v;
      DB.set(K.lists,L); render(); break; }
    case 'open-site': window.open(b.dataset.url,'_blank'); break;
    case 'del-site': if(isAdmin()){ DB.set(K.sites,sites().filter(s=>s.id!==b.dataset.id)); toast('website removed'); render(); } break;
    case 'del-osite': if(isAdmin()){ DB.set(K.olists,olists().filter(s=>s.id!==b.dataset.id)); toast('list removed'); render(); } break;
    case 'fav-reset': localStorage.removeItem(K.fav); applyFavicon(); toast('site icon reset'); render(); break;
    case 'backup': { const data={};
      ['users','posts','groups','dms','lists','sites','olists','reports'].forEach(k=>data[k]=DB.get(K[k],[]));
      data.follows=DB.get(K.follows,{}); data.notifs=DB.get(K.notifs,{});
      const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gd-community-backup.json'; a.click();
      URL.revokeObjectURL(a.href); toast('backup downloaded'); break; }
    case 'dm': dmWith=b.dataset.user; go({name:'dms'}); break;
    case 'del-user': { if(isAdmin()) deleteUser(b.dataset.user); break; }
  }
});

function deleteUser(name){
  DB.set(K.users, users().filter(u=>u.username!==name));
  DB.set(K.posts, posts().filter(p=>p.author!==name)
    .map(p=>({...p, likes:p.likes.filter(l=>l!==name), comments:p.comments.filter(c=>c.author!==name)})));
  DB.set(K.groups, groups().map(g=>({...g, members:g.members.filter(m=>m!==name)})));
  DB.set(K.dms, dms().filter(t=>!t.members.includes(name)));
  const L=lists().filter(l=>l.author!==name);
  L.forEach(l=>{
    l.comments=(l.comments||[]).filter(c=>c.author!==name);
    Object.values(l.reacts||{}).forEach(arr=>{ let i; while((i=arr.indexOf(name))>-1) arr.splice(i,1); });
    l.items.forEach(it=>{ delete (it.ratings||{})[name]; });
  });
  DB.set(K.lists,L);
  const f=followsMap(); delete f[name];
  Object.keys(f).forEach(k=>{ f[k]=f[k].filter(x=>x!==name); });
  DB.set(K.follows,f);
  if(dmWith===name) dmWith=null;
  toast('@'+name+' removed'); render();
}

/* ---------- forms ---------- */
function bindForms(){
  const on=(sel,fn)=>{ const el=$(sel); if(el) el.addEventListener('submit',e=>{ e.preventDefault(); fn(el); }); };
  on('#f-login',doLogin); on('#f-signup',doSignup); on('#f-post',doPost);
  on('#f-group-create',doCreateGroup); on('#f-dm',doSendDM); on('#f-bio',doSaveBio); on('#f-pass',doChangePass);
  on('#f-list',doSaveList); on('#f-item',doSaveItem); on('#f-victor',doAddVictor); on('#f-rules',doSaveRules);
  on('#f-site',f=>doAddDir(f,K.sites,'website added',['🌐','🔗','⭐','🎮','📺','🗺️','🧰','📰']));
  on('#f-osite',f=>doAddDir(f,K.olists,'list added',['📋','🏆','📊','⭐','😈','🗂️']));
  document.querySelectorAll('form[data-comment]').forEach(f=>
    f.addEventListener('submit',e=>{ e.preventDefault(); doComment(f.dataset.comment,f); }));
  const lc=document.querySelector('form[data-listcomment]');
  if(lc) lc.addEventListener('submit',e=>{ e.preventDefault(); doListComment(lc); });
  const af=$('#av-file'); if(af) af.addEventListener('change',onAvatarFile);
  const ff=$('#fav-file'); if(ff) ff.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    if(!file.type.startsWith('image/')){ toast('that is not an image','error'); return; }
    try{ DB.set(K.fav,await cropImage(file,64,64)); applyFavicon(); toast('site icon updated'); render(); }
    catch{ toast('could not read image','error'); } });
  const rf=$('#restore-file'); if(rf) rf.addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      if(!Array.isArray(data.users)) throw 0;
      ['users','posts','groups','dms','lists','sites','olists','reports'].forEach(k=>{ if(data[k]) localStorage.setItem(K[k],JSON.stringify(data[k)); });
      if(data.follows) localStorage.setItem(K.follows,JSON.stringify(data.follows));
      if(data.notifs) localStorage.setItem(K.notifs,JSON.stringify(data.notifs));
      toast('backup restored — reloading'); setTimeout(()=>location.reload(),700);
    }catch{ toast('invalid backup file','error'); }
  });
  const fs=$('#feed-search');
  if(fs){ fs.value=feedQ; fs.addEventListener('input',e=>{ feedQ=e.target.value;
    const el=$('#feed-list'); if(el) el.innerHTML=feedPostsHTML(); }); }
  const bf=$('#li-banner-file'); if(bf) bf.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    try{ syncListDraft(); listDraft.banner=await cropImage(file,900,300); render(); }catch{ toast('could not read image','error'); } });
  const lif=$('#li-icon-file'); if(lif) lif.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    try{ syncListDraft(); listDraft.iconImg=await cropImage(file,96,96); render(); }catch{ toast('could not read image','error'); } });
  const tf=$('#it-thumb-file'); if(tf) tf.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    try{ syncItemDraft(); itemDraft.thumb=await cropImage(file,200,200); render(); }catch{ toast('could not read image','error'); } });
  const pf=$('#it-photos-file'); if(pf) pf.addEventListener('change',async e=>{
    const files=[...e.target.files]; if(!files.length)return; syncItemDraft();
    try{ for(const file of files){ if(itemDraft.photos.length>=6){ toast('max 6 photos','error'); break; }
      itemDraft.photos.push(await fitImage(file,800)); } render(); }catch{ toast('could not read image','error'); } });
}

function doAddDir(f,key,msg,emojis){
  if(!isAdmin()) return;
  const name=f.elements.name.value.trim(), url=normUrl(f.elements.url.value), desc=f.elements.desc.value.trim();
  if(!name||!url){ toast('needs a name and a link','error'); return; }
  DB.set(key,[...DB.get(key,[]),{id:uid(),name,url,desc,emoji:emojis[Math.floor(Math.random()*emojis.length)],ts:Date.now()}]);
  toast(msg); render();
}
function doLogin(f){
  const u=f.elements.u.value.trim(), p=f.elements.p.value, err=$('#auth-err');
  const usr=findUser(u);
  if(!usr){ err.textContent='no account with that username'; return; }
  if(usr.pass!==hashPw(usr.username,p)){ err.textContent='wrong password'; return; }
  DB.set(K.session,usr.username); go({name:'feed'}); toast('welcome back, '+usr.username);
}
function doSignup(f){
  const u=f.elements.u.value.trim(), p=f.elements.p.value, p2=f.elements.p2.value, err=$('#auth-err');
  if(!/^[a-z0-9_]{3,16}$/i.test(u)){ err.textContent='username: 3–16 letters, numbers or _'; return; }
  if(findUser(u)){ err.textContent='that username is taken'; return; }
  if(p.length<6){ err.textContent='password needs at least 6 characters'; return; }
  if(p!==p2){ err.textContent="passwords don't match"; return; }
  const newUser={username:u,pass:hashPw(u,p),avatar:null,bio:'',joined:Date.now()};
  if(u.toLowerCase()==='myszon') newUser.role='admin';
  DB.set(K.users,[...users(),newUser]);
  DB.set(K.session,u); go({name:'feed'});
  toast(newUser.role?'welcome, admin':'welcome to the community');
}
function doPost(f){
  const t=f.elements.t.value.trim();
  const atts=(attach['post']||[]).slice();
  if(!t && !atts.length) return;
  DB.set(K.posts,[{id:uid(),author:me.username,text:t,tags:postTags.slice(),attachments:atts,ts:Date.now(),likes:[],comments:[],group:f.dataset.group||null},...posts()]);
  attach['post']=[]; postTags=[]; feedQ='';
  notifyMentions(t,'post');
  render();
}
function doComment(id,f){
  const t=f.elements.c.value.trim();
  const key='cmt:'+id;
  const atts=(attach[key]||[]).slice();
  if(!t && !atts.length) return;
  const l=posts(); const p=l.find(x=>x.id===id); if(!p) return;
  p.comments.push({id:uid(),author:me.username,text:t,attachments:atts,ts:Date.now()});
  DB.set(K.posts,l); attach[key]=[];
  notifyMentions(t,'comment');
  render();
  const inp=document.querySelector('form[data-comment="'+id+'"] input'); if(inp) inp.focus();
}
function doListComment(f){
  const t=f.elements.c.value.trim();
  const atts=(attach['lcmt']||[]).slice();
  if(!t && !atts.length) return;
  const L=lists(); const l=L.find(x=>x.slug===view.slug); if(!l) return;
  l.comments=l.comments||[];
  l.comments.push({id:uid(),author:me.username,text:t,attachments:atts,ts:Date.now()});
  DB.set(K.lists,L); attach['lcmt']=[];
  notifyMentions(t,'list comment');
  render();
}
function doCreateGroup(f){
  const name=f.elements.name.value.trim(), desc=f.elements.desc.value.trim();
  if(name.length<3){ toast('group name too short','error'); return; }
  const emojis=['🟩','🟨','🔺','⭐','💠','🌀','👾','🎮','🕹️','🧊','😈','🚀'];
  const g={id:uid(),name,desc,emoji:emojis[Math.floor(Math.random()*emojis.length)],members:[me.username],owner:me.username,ts:Date.now()};
  DB.set(K.groups,[...groups(),g]); go({name:'group',id:g.id}); toast('group created');
}
function doSendDM(f){
  const t=f.elements.t.value.trim();
  const atts=(attach['dm']||[]).slice();
  if(!t && !atts.length) return;
  if(!dmWith) return;
  const tid=[me.username,dmWith].sort().join('|');
  const l=dms(); let th=l.find(x=>x.id===tid);
  if(!th){ th={id:tid,members:[me.username,dmWith],msgs:[]}; l.push(th); }
  th.msgs.push({from:me.username,text:t,attachments:atts,ts:Date.now()});
  DB.set(K.dms,l); attach['dm']=[];
  if(dmWith!==me.username) notify(dmWith,{type:'mention',from:me.username,where:'DM'});
  notifyMentions(t,'DM');
  focusDM=true; render();
}
function doSaveBio(f){ saveUser({bio:f.elements.bio.value.trim()}); toast('bio saved'); render(); }
function doChangePass(f){
  const err=$('#pass-err'); err.textContent='';
  const cur=f.elements.cur.value, p1=f.elements.p1.value, p2=f.elements.p2.value;
  if(me.pass!==hashPw(me.username,cur)){ err.textContent='current password is wrong'; return; }
  if(p1.length<6){ err.textContent='new password needs at least 6 characters'; return; }
  if(p1!==p2){ err.textContent="new passwords don't match"; return; }
  saveUser({pass:hashPw(me.username,p1)});
  toast('password changed'); render();
}
function doSaveRules(f){
  const l0=lists().find(x=>x.slug===view.slug); if(!l0||!canList(l0)) return;
  const L=lists(); const l=L.find(x=>x.id===l0.id);
  l.rules=f.elements.rules.value; l.edited=Date.now();
  DB.set(K.lists,L); toast('rules saved'); render();
}
function doAddVictor(f){
  const ctx=levelCtx(); if(!ctx||!canList(ctx.list)) return;
  const name=f.elements.name.value.trim();
  if(!name){ toast('write who beat it','error'); return; }
  const L=lists(); const l=L.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
  it.victors=it.victors||[];
  it.victors.push({name,video:normUrl(f.elements.video.value),ts:Date.now()});
  it.edited=l.edited=Date.now();
  DB.set(K.lists,L);
  const u=findUser(name); if(u) notify(u.username,{type:'mention',from:me.username,where:'new record'});
  toast(name+' added as victor'); render();
}
function doSaveList(f){
  syncListDraft();
  const name=(listDraft.name||'').trim();
  if(name.length<2){ toast('the list needs a name','error'); return; }
  const desc=(listDraft.desc||'').trim(), rules=listDraft.rules||'', discord=normUrl(listDraft.discord);
  const L=lists();
  if(listModal==='new'){
    L.push({id:uid(),slug:uniqueListSlug(name),name,desc,rules,discord,icon:listDraft.icon,iconImg:listDraft.iconImg,color:listDraft.color,banner:listDraft.banner,
      author:me.username,created:Date.now(),edited:Date.now(),reacts:{},comments:[],items:[]});
    DB.set(K.lists,L); listModal=null; toast('list created');
    go({name:'listview',slug:L[L.length-1].slug}); return;
  }
  const l=L.find(x=>x.id===listModal);
  if(l&&canList(l)){ Object.assign(l,{name,desc,rules,discord,icon:listDraft.icon,iconImg:listDraft.iconImg,color:listDraft.color,banner:listDraft.banner,edited:Date.now()});
    DB.set(K.lists,L); toast('list updated'); }
  listModal=null; render();
}
function doSaveItem(f){
  syncItemDraft();
  const d=itemDraft; if(!d||!itemModal) return;
  const title=(d.title||'').trim();
  if(title.length<2){ toast('the level needs a name','error'); return; }
  const tags=(d.tags||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);
  const points=Math.max(0,Math.min(99999,parseInt(d.points,10)||0));
  const verifier={name:(d.vname||'').trim(),video:normUrl(d.vvideo)};
  const L=lists(); const l=L.find(x=>x.id===itemModal.list); if(!l||!canList(l)) return;
  if(itemModal.id){
    const it=l.items.find(x=>x.id===itemModal.id);
    if(it){ Object.assign(it,{title,desc:d.desc.trim(),tags,points,verifier,thumb:d.thumb,photos:d.photos,edited:Date.now()});
      l.edited=Date.now(); toast('level updated'); }
  } else {
    const slug=uniqueItemSlug(l,title);
    l.items.push({id:uid(),slug,title,desc:d.desc.trim(),tags,points,verifier,
      victors:[],thumb:d.thumb,photos:d.photos,ratings:{},
      author:me.username,created:Date.now(),edited:Date.now()});
    l.edited=Date.now(); openLevel=slug; toast('level added (at the bottom — use ↑↓ to move it)');
  }
  DB.set(K.lists,L); itemModal=null; render();
}
async function onAvatarFile(e){
  const file=e.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('that is not an image','error'); return; }
  if(file.size>8*1024*1024){ toast('image too big (max 8MB)','error'); return; }
  try{ saveUser({avatar:await cropImage(file,144,144)}); toast('avatar updated'); render(); }
  catch{ toast('could not read that image','error'); }
}

window.addEventListener('storage',()=>render());

seed();
applyFavicon();
view=parseHash();
render();
</script>
