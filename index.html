<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD COMMUNITY</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--bg1:#0b62c4; --bg2:#073b83; --deep:#051a35;
--panel:#0f3560; --panel2:#0a2a50; --edge:rgba(255,255,255,.10);
--green:#8ee85d; --green2:#4db32a; --yellow:#ffd93b; --orange:#ff9f2e; --blue:#5db9ff;
--text:#fff; --mut:#9db8d8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rubik',sans-serif;color:var(--text);min-height:100vh;
background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%,#062f67);background-attachment:fixed}
button{font:inherit;cursor:pointer}
::selection{background:rgba(255,217,59,.4)}
.mut{color:var(--mut)} .small{font-size:.8rem}
.gd-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
font-family:'Titan One';font-size:.9rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
background:linear-gradient(180deg,var(--green),var(--green2));
border:3px solid #1d5c10;border-radius:12px;padding:11px 20px;
box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #17490d;transition:transform .1s,filter .15s}
.gd-btn:hover{filter:brightness(1.08)}
.gd-btn:active{transform:translateY(3px)}
.gd-btn.blue{background:linear-gradient(180deg,#5db9ff,#2a7fd4);border-color:#0f3d73;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #0c315c}
.gd-btn.ghost{background:var(--panel);border-color:#164a80;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 4px 0 #07264b}
.gd-btn.small{font-size:.72rem;padding:8px 14px;border-width:2px;border-radius:10px}
.gd-btn:disabled{opacity:.4;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:16px;
box-shadow:0 8px 20px rgba(2,10,22,.22)}
.inp,textarea.inp,select.inp{width:100%;background:var(--panel2);border:1px solid rgba(255,255,255,.12);border-radius:10px;
color:#fff;padding:11px 13px;font:inherit;font-size:.95rem;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--blue)}
.inp::placeholder,textarea.inp::placeholder{color:#5f7ea6}
textarea.inp{resize:vertical}
.av,.cube{display:inline-block;flex:none;border-radius:18%}
.av{object-fit:cover;border:2px solid rgba(0,0,0,.35)}
.cube{position:relative;background:linear-gradient(180deg,var(--c1),var(--c2));
box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.25)}
.cube i,.cube em{position:absolute;background:#102540;border-radius:2px}
.cube i{top:26%;width:16%;height:26%}
.cube i:first-child{left:22%} .cube i:nth-child(2){right:22%}
.cube em{left:30%;right:30%;bottom:18%;height:12%}
.s28{width:28px;height:28px} .s30{width:30px;height:30px} .s44{width:44px;height:44px}
.s64{width:64px;height:64px} .s72{width:72px;height:72px} .s96{width:96px;height:96px}
.admintag{display:inline-block;background:#ffd93b;color:#3d2c00;font-size:.58rem;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:6px;margin-left:7px;vertical-align:middle}
.uname{background:none;border:none;padding:0;font:inherit;font-weight:700;color:#fff;cursor:pointer}
.uname:hover{text-decoration:underline}
.icon-btn{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 11px;font-size:.95rem;line-height:1;transition:.15s}
.icon-btn:hover{background:#164a80}
.dot-n{position:absolute;top:-6px;right:-6px;background:#ffd93b;color:#3d2c00;font-size:.6rem;font-weight:700;border-radius:99px;padding:2px 5px}
.dot-n.red{background:#ff7a6b;color:#3a0d0d}
.userwrap{position:relative}
.umenu{position:absolute;right:0;top:calc(100% + 8px);background:#0e2f57;border:1px solid rgba(255,255,255,.14);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);padding:6px;min-width:200px;z-index:30;animation:pop .15s ease-out}
.umenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:10px 12px;border-radius:8px;font-size:.9rem}
.umenu button:hover{background:rgba(255,255,255,.08)}
.badge-n{background:#ffd93b;color:#3d2c00;border-radius:99px;font-size:.6rem;font-weight:700;padding:2px 6px;margin-left:6px}
.badge-n.red{background:#ff7a6b;color:#3a0d0d}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ach{padding:10px 6px;border-radius:10px;background:var(--panel2);border:1px solid rgba(255,255,255,.08);text-align:center;font-size:.66rem;color:var(--mut);line-height:1.3}
.ach .ic{font-size:1.35rem;display:block;margin-bottom:6px}
.ach.got{border-color:rgba(255,217,59,.6);color:#fff;background:rgba(255,217,59,.07)}
.ach:not(.got){opacity:.4}
.ach-mini{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:1.05rem}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:30px 18px}
.logo-big{text-align:center}
.logo-big h1{font-family:'Titan One';font-size:clamp(2rem,6vw,3.1rem);text-shadow:0 4px 0 rgba(0,0,0,.3);margin-top:14px}
.logo-big h1 span{color:var(--yellow)}
.logo-big p{margin-top:6px}
.auth-card{width:min(420px,100%);padding:28px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.aform label{display:block;font-size:.66rem;letter-spacing:.2em;color:var(--mut);font-weight:700;margin:14px 0 6px}
.form-err{color:#ff9090;min-height:22px;font-size:.88rem;margin-top:8px;text-align:center}
.setup{max-width:640px;margin:60px auto;padding:26px;line-height:1.7}
.setup li{margin:8px 0 8px 18px}
.setup code{background:var(--panel2);padding:2px 7px;border-radius:6px;font-size:.85rem}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
padding:10px clamp(14px,3vw,28px);background:rgba(8,38,77,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:'Titan One';font-size:1.1rem;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.logo span{color:var(--green)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{font-family:'Titan One';font-size:.72rem;padding:9px 13px;border-radius:10px;border:1px solid transparent;background:transparent;color:#bcd6f2;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:#1c4f92;border-color:rgba(255,255,255,.14);color:#fff}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:none;border:none;color:#fff;font-weight:700;padding:4px 10px;border-radius:10px;transition:.15s}
.chip:hover{background:rgba(255,255,255,.08)}
.wrap{max-width:1180px;margin:0 auto;padding:24px clamp(14px,3vw,28px) 80px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-family:'Titan One';font-size:1.35rem;text-shadow:0 2px 0 rgba(0,0,0,.3)}
/* FEED 3-COLUMN */
.feed-grid{display:grid;grid-template-columns:250px minmax(0,1fr) 272px;gap:18px;align-items:start}
.rail-left,.rail-right{position:sticky;top:74px;display:flex;flex-direction:column;gap:14px}
@media(max-width:1150px){
.feed-grid{grid-template-columns:236px minmax(0,1fr)}
.rail-right{position:static;grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:14px}
}
@media(max-width:820px){
.feed-grid{grid-template-columns:1fr}
.rail-left{position:static}
.rail-right{grid-template-columns:1fr}
}
.pcard{padding:20px;text-align:center}
.pcard h3{margin-top:10px;font-size:1.02rem}
.pcard .bio{margin-top:8px;font-size:.87rem;color:var(--mut);min-height:1em;word-break:break-word}
.pcard .fline{margin-top:10px;font-size:.8rem;color:var(--mut)}
.pcard .fline b{color:#fff}
.stats{display:flex;gap:8px;margin:14px 0 4px}
.stats div{flex:1;background:var(--panel2);border-radius:10px;padding:9px 4px}
.stats b{display:block;color:var(--yellow);font-size:1rem}
.stats span{font-size:.58rem;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.rail-title{font-size:.66rem;letter-spacing:.2em;color:var(--mut);font-weight:700}
.rec-row{display:flex;gap:8px;align-items:center;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:.83rem;flex-wrap:wrap;transition:.15s}
.rec-row:hover{background:rgba(255,255,255,.06)}
.composer{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px}
.composer .stack{display:flex;flex-direction:column;gap:10px}
.composer .row{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.ttag{cursor:pointer;border:none;transition:.15s}
.ttag:hover{background:#2663b3}
.ttag.sel{background:#ffd93b;color:#3d2c00}
.clicktag{cursor:pointer;border:none}
.clicktag:hover{background:#2663b3}
.searchbar{display:flex;align-items:center;gap:10px;padding:6px 14px;margin-bottom:14px}
.searchbar input{flex:1;background:transparent;border:none;color:#fff;font:inherit;font-size:.95rem;outline:none}
.searchbar input::placeholder{color:#5f7ea6}
.ftabs{display:flex;gap:8px;margin-bottom:14px}
.ftab{font-family:'Titan One';font-size:.68rem;padding:8px 14px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);color:var(--mut);transition:.15s}
.ftab:hover{color:#fff}
.ftab.active{background:#1c4f92;color:#fff;border-color:rgba(255,255,255,.14)}
.feed-list{display:flex;flex-direction:column;gap:14px}
.post{padding:16px}
.post-head{display:flex;gap:11px;align-items:center}
.post-head .who span{font-size:.78rem;color:var(--mut);display:block}
.gtag{margin-left:auto;font-size:.72rem;background:#1c4f92;border:1px solid rgba(255,255,255,.14);color:#cfe3fa;border-radius:99px;padding:4px 11px;white-space:nowrap}
.post-text{margin-top:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:.96rem}
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.post-actions{display:flex;gap:4px;align-items:center;margin-top:11px;border-top:1px solid rgba(255,255,255,.07);padding-top:9px}
.act{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-size:.88rem;padding:6px 11px;border-radius:8px;transition:.15s}
.act:hover{background:rgba(255,255,255,.07);color:#fff}
.act.liked{color:var(--yellow)}
.del{background:none;border:none;color:#6c88ab;font-size:.78rem;padding:5px 9px;border-radius:8px;transition:.15s}
.del:hover{color:#ff8a8a;background:rgba(255,90,90,.12)}
@media(hover:hover){
.act-extra{opacity:0;transition:opacity .15s}
.post:hover .act-extra,.act-extra:focus-visible{opacity:1}
}
.comments{margin-top:10px}
.cmt{display:flex;gap:9px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:.9rem;align-items:flex-start}
.cmt .mut{font-size:.74rem}
.cmt-body{min-width:0;word-break:break-word}
.cmt .del{margin-left:auto}
.cmt-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.cmt-form .inp{flex:1;min-width:120px}
.empty{padding:30px;text-align:center;color:var(--mut)}
.clip{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--edge);border-radius:10px;background:var(--panel2);cursor:pointer;font-size:1rem;flex:none;transition:.15s}
.clip:hover{border-color:var(--blue)}
.attach-strip{display:flex;gap:8px;flex-wrap:wrap}
.attach-strip:empty{display:none}
.att-chip{position:relative;display:inline-block}
.att-chip img{width:46px;height:46px;object-fit:cover;border-radius:8px;border:2px solid var(--edge)}
.att-chip.file{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 28px 8px 10px;font-size:.74rem;color:var(--blue);max-width:210px}
.att-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.att-img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:2px solid var(--edge);cursor:pointer}
.att-file{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 11px;font-size:.76rem;color:var(--blue);text-decoration:none;max-width:230px}
.att-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub .atts{margin-top:8px}
.bub .att-img{width:140px;height:140px}
.g-create{display:flex;gap:10px;padding:14px;flex-wrap:wrap;margin-bottom:16px}
.g-create .inp{flex:1;min-width:140px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.g-card{padding:16px;cursor:pointer;transition:transform .15s}
.g-card:hover{transform:translateY(-3px)}
.g-card .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.g-emoji{font-size:1.9rem}
.g-card h4{font-size:1rem}
.g-card p{font-size:.85rem;color:var(--mut);margin:6px 0 10px;min-height:2.5em}
.g-foot{display:flex;align-items:center;justify-content:space-between}
.g-head{display:flex;gap:16px;align-items:center;padding:18px;margin-bottom:16px;flex-wrap:wrap}
.g-head .g-emoji{font-size:3rem}
.g-head .info{flex:1;min-width:180px}
.g-head h2{font-family:'Titan One';font-size:1.3rem}
.g-head p{color:var(--mut);font-size:.9rem;margin-top:3px}
.l-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-top:6px}
.l-card{cursor:pointer;overflow:hidden;transition:transform .15s}
.l-card:hover{transform:translateY(-3px)}
.lc-banner{height:92px;background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font-size:2.2rem}
.lc-icon{position:absolute;left:14px;bottom:-17px;width:46px;height:46px;border-radius:12px;background:var(--panel2);border:2px solid var(--edge);display:grid;place-items:center;font-size:1.4rem;overflow:hidden}
.lc-icon img{width:100%;height:100%;object-fit:cover}
.lc-body{padding:24px 16px 16px}
.lc-body h4{font-family:'Titan One';font-size:1rem}
.lc-body p{font-size:.85rem;color:var(--mut);margin:6px 0 10px;min-height:2.4em;word-break:break-word}
.lc-meta{font-size:.72rem;color:var(--mut);line-height:1.5}
.pick-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.icon-pick{width:36px;height:36px;border-radius:9px;border:2px solid var(--edge);background:var(--panel2);font-size:18px;display:grid;place-items:center;transition:.15s}
.icon-pick.sel{border-color:var(--yellow);background:rgba(255,217,59,.14)}
.color-pick{width:34px;height:34px;border-radius:9px;border:2px solid rgba(255,255,255,.18)}
.color-pick.sel{box-shadow:0 0 0 2px var(--deep),0 0 0 4px #fff}
.banprev{height:86px;border-radius:10px;background-size:cover;background-position:center;border:2px dashed rgba(255,255,255,.2);display:grid;place-items:center;color:var(--mut);font-size:.8rem;margin-top:8px}
.m-label{font-size:.64rem;letter-spacing:.2em;color:var(--mut);font-weight:700;margin:14px 0 6px;display:block}
.tagchip{background:#1c4f92;border-radius:99px;padding:3px 10px;font-size:.72rem;color:#cfe3fa;white-space:nowrap;display:inline-block}
.lv-banner{height:150px;border-radius:15px 15px 0 0;background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font-size:3rem}
.lv-icon{position:absolute;left:20px;bottom:-22px;width:60px;height:60px;border-radius:14px;background:var(--panel2);border:2px solid var(--edge);display:grid;place-items:center;font-size:1.9rem;overflow:hidden}
.lv-icon img{width:100%;height:100%;object-fit:cover}
.lv-head{padding:34px 20px 18px}
.lv-head h2{font-family:'Titan One';font-size:1.5rem}
.lv-head .desc{color:var(--mut);margin-top:6px;word-break:break-word}
.lv-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.78rem;color:var(--mut)}
.ltabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.ltab{font-family:'Titan One';font-size:.74rem;padding:9px 18px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);color:var(--mut);transition:.15s}
.ltab:hover{color:#fff}
.ltab.active{background:#1c4f92;color:#fff;border-color:rgba(255,255,255,.14)}
.dlist{display:flex;flex-direction:column;gap:12px}
.drow{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;transition:transform .15s}
.drow:hover{transform:translateX(4px)}
.drow.open{border-radius:16px 16px 0 0;transform:none}
.drank{font-family:'Titan One';font-size:1.4rem;min-width:60px;color:#7d9cc4;text-align:center}
.drank.r1{color:#ffd93b} .drank.r2{color:#d5dee8} .drank.r3{color:#e8a06a}
.dthumb{width:96px;height:54px;object-fit:cover;border-radius:8px;border:2px solid var(--edge);flex:none}
.dthumb-ph{width:96px;height:54px;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;background:var(--panel2);font-size:1.3rem;flex:none}
.dmain{flex:1;min-width:0}
.dmain h4{font-family:'Titan One';font-size:1rem;word-break:break-word}
.dmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--mut);margin-top:4px}
.dside{display:flex;gap:10px;align-items:center;flex:none}
.chev{color:var(--mut);font-size:.7rem}
.dexp{padding:18px;margin-top:-8px;border-radius:0 0 16px 16px;position:relative}
.ddesc{line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.i-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dphotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dphotos img{height:80px;border-radius:8px;border:2px solid var(--edge);cursor:pointer}
.dtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-top:8px;flex-wrap:wrap}
.rate-star{background:none;border:none;font-size:1.35rem;color:#3f5f8d;padding:2px}
.rate-star.on{color:var(--yellow)}
.react-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:6px 12px;font-size:.9rem;color:#fff;transition:.15s}
.react-btn.sel{border-color:var(--green);background:rgba(142,232,93,.12)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#b23b3b;color:#fff;border:none;font-size:.6rem;display:grid;place-items:center}
.lf-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sep{border:none;border-top:2px dashed rgba(255,255,255,.15);margin:18px 0}
.lb-row{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-bottom:12px;flex-wrap:wrap}
.rank{font-family:'Titan One';width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem;background:#1c4f92;border:1px solid rgba(255,255,255,.14);flex:none}
.rank.r1{background:linear-gradient(180deg,#ffe45e,#e0a013);border-color:#8a6206;color:#3d2c00}
.rank.r2{background:linear-gradient(180deg,#e8eef4,#9fb2c4);border-color:#5d6f80;color:#22303d}
.rank.r3{background:linear-gradient(180deg,#e8a06a,#b0642e);border-color:#6e3d17;color:#3a2008}
.lb-name{flex:1;min-width:170px}
.lb-clears{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.lb-pts{font-family:'Titan One';color:var(--yellow);font-size:1.15rem;margin-left:auto}
.dms{display:grid;grid-template-columns:230px 1fr;gap:14px;height:calc(100vh - 160px);min-height:430px}
.dm-list{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.dm-user{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer;color:#fff;font-weight:500;transition:.15s}
.dm-user:hover{background:rgba(255,255,255,.07)}
.dm-user.sel{background:#1c4f92}
.dm-thread{display:flex;flex-direction:column;overflow:hidden}
.dm-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700}
#dm-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:72%;padding:9px 13px;border-radius:14px;font-size:.93rem;line-height:1.45;word-break:break-word}
.bub.mine{align-self:flex-end;background:linear-gradient(180deg,var(--green),var(--green2));color:#0c2b06;border-bottom-right-radius:4px}
.bub.theirs{align-self:flex-start;background:#1c4f92;border-bottom-left-radius:4px}
.dm-form{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,.1);align-items:center}
.dm-empty{height:100%;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
.ntf{padding:11px 6px;border-top:1px solid rgba(255,255,255,.07);font-size:.88rem}
.ntf.click{cursor:pointer}
.rep{padding:12px 6px;border-top:1px solid rgba(255,255,255,.07);font-size:.88rem}
.rep .quote{color:var(--mut);margin:6px 0 8px;font-style:italic}
.prof-head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.prof-recs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(3,12,26,.62);display:grid;place-items:center;z-index:40;animation:fadeIn .2s ease;padding:16px}
.modal{width:min(430px,94vw);padding:24px;animation:pop .2s ease-out;max-height:92vh;overflow-y:auto}
.modal.wide{width:min(600px,94vw)}
.m-title{font-family:'Titan One';font-size:1.05rem;margin-bottom:6px}
.m-av{display:flex;justify-content:center;margin:8px 0 14px}
.m-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.97);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--deep);border:1px solid #1e4d7a;border-radius:10px;padding:10px 18px;font-size:.9rem;animation:pop .2s ease-out;white-space:nowrap}
.toast.error{border-color:#a33;color:#ffb0b0}
.toast.out{opacity:0;transition:opacity .3s}
@media(max-width:820px){
.dms{grid-template-columns:1fr;height:auto}
.dm-list{flex-direction:row;overflow-x:auto;overflow-y:hidden}
.dm-user{flex:none}
.dm-thread{height:62vh}
.f-grid{grid-template-columns:1fr}
.dthumb,.dthumb-ph{width:64px;height:40px}
.drank{min-width:48px;font-size:1.1rem}
}

function editDist(a,b){ if(Math.abs(a.length-b.length)>2) return 99;

for(let i=1;i<=a.length;i++){ const cur=[i];
for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
prev=cur; } return prev[b.length]; }
function wordScore(w,t){ if(w===t)return 3;
if(t.length>=3&&w.startsWith(t))return 2; if(t.length>=3&&w.includes(t))return 2;
if(t.length>=4){ const allow=t.length>=8?2:1;
const d=Math.min(editDist(w,t),editDist(w.slice(0,t.length+1),t)); if(d<=allow)return 1; } return 0; }
function docScore(words,tokens){ let s=0;
for(const t of tokens){ if(STOP.has(t))continue; let best=0;
for(const w of words){ const sc=wordScore(w,t); if(sc>best){best=sc;if(best===3)break;} } s+=best; } return s; }

const add=(name,pts,entry)=>{ if(!name)return; const k=name.toLowerCase();
map[k]=map[k]||{name,pts:0,clears:[]}; map[k].pts+=pts; map[k].clears.push(entry); };

if(it.verifier&&it.verifier.name)add(it.verifier.name,pts,{level:it.title,pts,role:'verifier'});

const inWrap=!!e.target.closest('.userwrap');
if(userMenu && !inWrap){ userMenu=false; if(!b){ render(); return; } }
if(!b)return;
if(!inWrap) userMenu=false;
const act=b.dataset.act;
if(act==='m-close'&&e.target.closest('.modal'))return;
switch(act){
case 'auth-tab': authTab=b.dataset.tab; render(); break;
case 'nav': go({name:b.dataset.view}); break;
case 'nav-go': go({name:b.dataset.to}); break;
case 'user-menu': userMenu=!userMenu; render(); break;
case 'logout': userMenu=false; settingsOpen=false;profileView=null;notifsOpen=false;reportsOpen=false;listModal=null;itemModal=null;ytModal=null;imgModal=null;dmWith=null;editingVictor=null;openComments.clear();
sb.auth.signOut(); location.hash='#/feed'; render(); break;
case 'settings': userMenu=false; settingsOpen=true; render(); break;
case 'm-close': case 'm-close-btn': closeModal(); break;
case 'remove-photo': saveUser({avatar:''}); toast('photo removed'); break;
case 'view-img': imgModal={src:b.dataset.src}; render(); break;
case 'attach-del': { const k=b.dataset.key; if(attach[k]){attach[k].splice(+b.dataset.i,1);updateStrip(k);} break; }
case 'ptag': { const t=b.dataset.t; const i=postTags.indexOf(t); i<0?postTags.push(t):postTags.splice(i,1); b.classList.toggle('sel'); break; }
case 'ftag': { feedQ=b.dataset.t;
if(view.name!=='feed'){go({name:'feed'});}
else{const fs=$('#feed-search');if(fs)fs.value=feedQ;const el=$('#feed-list');if(el)el.innerHTML=feedPostsHTML();} break; }
case 'feed-filter': feedFilter=b.dataset.f; render(); break;
case 'go-record': location.hash='#/lista/'+b.dataset.slug+'/'+b.dataset.lv; break;
case 'profile-view': userMenu=false; notifsOpen=false; profileView=b.dataset.user; render(); break;
case 'plist-open': profileView=null; go({name:'listview',slug:b.dataset.slug}); break;
case 'prof-dm': dmWith=profileView; profileView=null; go({name:'dms'}); break;
case 'follow': toggleFollow(b.dataset.user); break;
case 'notifs': { userMenu=false; (async()=>{ const rows=myNotifRows().filter(r=>!r.data.read);
rows.forEach(r=>r.data.read=true);
for(const r of rows) await sb.from('notifs').update({data:r.data}).eq('id',r.id);
notifsOpen=true; render(); })(); break; }
case 'open-reports': userMenu=false; reportsOpen=true; render(); break;
case 'report-post': { const p=posts().find(x=>x.id===b.dataset.id);
if(p)makeReport('post',p.id,null,p.author,p.text); break; }
case 'report-comment': { const p=posts().find(x=>x.id===b.dataset.post); const c=p&&p.comments.find(x=>x.id===b.dataset.cid);
if(c)makeReport('comment',c.id,p.id,c.author,c.text); break; }
case 'report-lcomment': { const l=lists().find(x=>x.slug===view.slug); const c=l&&(l.comments||[]).find(x=>x.id===b.dataset.cid);
if(c)makeReport('list comment',c.id,null,c.author,c.text); break; }
case 'rep-dismiss': (async()=>{ await resolveReport(b.dataset.id); render(); })(); break;
case 'rep-delete': (async()=>{ const r=S.reports.find(x=>x.id===b.dataset.id); if(!r)return;
const d=r.data;
if(d.type==='post'){ await dbDel('posts',d.targetId); S.posts=S.posts.filter(p=>p.id!==d.targetId); }
else if(d.type==='comment'){ const p=S.posts.find(x=>x.id===d.postId);
if(p){ p.comments=p.comments.filter(c=>c.id!==d.targetId); await savePostRow(p); } }
else { for(const l of S.lists){ const c=(l.comments||[]).find(x=>x.id===d.targetId);
if(c){ l.comments=l.comments.filter(x=>x.id!==d.targetId); await saveListRow(l); break; } } }
await resolveReport(b.dataset.id); toast('content deleted'); render(); })(); break;
case 'like': doLike(b.dataset.id); break;
case 'comments': { const id=b.dataset.id; openComments.has(id)?openComments.delete(id):openComments.add(id); render(); break; }
case 'del-post': doDelPost(b.dataset.id); break;
case 'del-comment': doDelComment(b.dataset.post,b.dataset.cid); break;
case 'open-group': go({name:'group',id:b.dataset.id}); break;
case 'join': doJoin(b.dataset.id); break;
case 'new-list': listModal='new'; listDraft={name:'',desc:'',rules:'',discord:'',icon:'⭐',iconImg:null,color:0,banner:null}; render(); break;
case 'edit-list': { const l=lists().find(x=>x.id===b.dataset.id);
if(l&&canList(l)){listModal=l.id;listDraft={name:l.name,desc:l.desc||'',rules:l.rules||'',discord:l.discord||'',icon:l.icon,iconImg:l.iconImg||null,color:l.color,banner:l.banner};render();} break; }
case 'go-list': go({name:'listview',slug:b.dataset.slug}); break;
case 'del-list': (async()=>{ const l=S.lists.find(x=>x.id===b.dataset.id); if(!l)return;
await dbDel('lists',l.id); S.lists=S.lists.filter(x=>x.id!==l.id); toast('list deleted'); go({name:'lists'}); })(); break;
case 'list-tab': listTab=b.dataset.t; render(); break;
case 'li-icon': syncListDraft(); listDraft.icon=b.dataset.i; listDraft.iconImg=null; render(); break;
case 'li-icon-del': syncListDraft(); listDraft.iconImg=null; render(); break;
case 'li-color': syncListDraft(); listDraft.color=+b.dataset.i; render(); break;
case 'li-banner-del': syncListDraft(); listDraft.banner=null; render(); break;
case 'copy-link': copyText(b.dataset.href); break;
case 'watch': { const id=ytId(b.dataset.url);
if(id){ytModal={title:b.dataset.title||'video',id};render();} else window.open(b.dataset.url,'_blank'); break; }
case 'lreact': (async()=>{ const l=S.lists.find(x=>x.slug===view.slug); if(!l)return;
l.reacts=l.reacts||{}; const e2=b.dataset.e; l.reacts[e2]=l.reacts[e2]||[];
const i=l.reacts[e2].indexOf(me.username); i<0?l.reacts[e2].push(me.username):l.reacts[e2].splice(i,1);
render(); await saveListRow(l); })(); break;
case 'del-lcomment': doDelLComment(b.dataset.cid); break;
case 'lvl-toggle': { const s=b.dataset.slug; openLevel=openLevel===s?null:s; editingVictor=null; render(); break; }
case 'lvl-up': case 'lvl-down': (async()=>{ const l=S.lists.find(x=>x.slug===view.slug);
if(l&&canList(l)){ const i=l.items.findIndex(x=>x.slug===b.dataset.slug); const j=act==='lvl-up'?i-1:i+1;
if(i>-1&&j>-1&&j<l.items.length){ [l.items[i],l.items[j]]=[l.items[j],l.items[i]]; l.edited=Date.now(); render(); await saveListRow(l); } } })(); break;
case 'new-item': itemModal={list:b.dataset.list,id:null};
itemDraft={title:'',desc:'',tags:'',points:'',vname:'',vvideo:'',thumb:null,photos:[]}; render(); break;
case 'edit-item': { const l=lists().find(x=>x.slug===view.slug);
const it=l&&l.items.find(x=>x.id===b.dataset.id);
if(l&&it&&canList(l)){itemModal={list:l.id,id:it.id};
itemDraft={title:it.title,desc:it.desc||'',tags:(it.tags||[]).join(', '),points:it.points||'',
vname:(it.verifier||{}).name||'',vvideo:(it.verifier||{}).video||'',thumb:it.thumb,photos:[...(it.photos||[])]};render();} break; }
case 'del-item': (async()=>{ const l=S.lists.find(x=>x.slug===view.slug); if(!l||!canList(l))return;
l.items=l.items.filter(x=>x.id!==b.dataset.id); l.edited=Date.now(); openLevel=null; editingVictor=null;
render(); await saveListRow(l); toast('level deleted'); })(); break;
case 'iphoto-del': syncItemDraft(); itemDraft.photos.splice(+b.dataset.i,1); render(); break;
case 'vic-edit': editingVictor={slug:openLevel,i:+b.dataset.i}; render(); break;
case 'vic-cancel': editingVictor=null; render(); break;
case 'vic-save': (async()=>{ const ctx=levelCtx(); if(!ctx||!editingVictor)return;
const name=$('#vic-name').value.trim(), video=normUrl($('#vic-video').value);
if(!name){toast("victor name can't be empty",'error');return}
const l=S.lists.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
const v=(it.victors||[])[editingVictor.i];
if(v){v.name=name;v.video=video;it.edited=l.edited=Date.now();render();await saveListRow(l);toast('victor updated');}
editingVictor=null; })(); break;
case 'del-victor': (async()=>{ const ctx=levelCtx(); if(!ctx)return;
const l=S.lists.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
if(it&&canList(l)){it.victors=(it.victors||[]);it.victors.splice(+b.dataset.i,1);it.edited=l.edited=Date.now();render();await saveListRow(l);} })(); break;
case 'rate': (async()=>{ const ctx=levelCtx(); if(!ctx)return;
const l=S.lists.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
it.ratings=it.ratings||{}; const v=+b.dataset.val;
if(it.ratings[me.username]===v)delete it.ratings[me.username]; else it.ratings[me.username]=v;
render(); await saveListRow(l); })(); break;
case 'open-site': window.open(b.dataset.url,'_blank'); break;
case 'del-site': (async()=>{ if(isAdmin()){ await dbDel('sites',b.dataset.id); S.sites=S.sites.filter(s=>s.id!==b.dataset.id); toast('website removed'); render(); } })(); break;
case 'del-osite': (async()=>{ if(isAdmin()){ await dbDel('olists',b.dataset.id); S.olists=S.olists.filter(s=>s.id!==b.dataset.id); toast('list removed'); render(); } })(); break;
case 'fav-reset': (async()=>{ S.favicon=null; applyFavicon(); await sb.from('meta').delete().eq('key','favicon'); toast('site icon reset'); render(); })(); break;
case 'backup': { const data={users:S.users,posts:S.posts,groups:S.groups,dms:S.dms,lists:S.lists,sites:S.sites,olists:S.olists};
const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gd-community-backup.json'; a.click();
URL.revokeObjectURL(a.href); toast('backup downloaded'); break; }
case 'dm': dmWith=b.dataset.user; go({name:'dms'}); break;
case 'del-user': toast('user removal: do this in the Supabase dashboard (Authentication → users)','error'); break;
}
});
function bindForms(){
const on=(sel,fn)=>{const el=$(sel);if(el)el.addEventListener('submit',e=>{e.preventDefault();fn(el);});};
on('#f-login',doLogin); on('#f-signup',doSignup); on('#f-post',doPost);
on('#f-group-create',doCreateGroup); on('#f-dm',doSendDM); on('#f-bio',doSaveBio);
on('#f-list',doSaveList); on('#f-item',doSaveItem); on('#f-victor',doAddVictor); on('#f-rules',doSaveRules);
on('#f-site',f=>doAddDir(f,'sites','website added',['🌐','🔗','⭐','🎮','📺','🗺️','🧰','📰']));
on('#f-osite',f=>doAddDir(f,'olists','list added',['📋','🏆','📊','⭐','😈','🗂️']));
document.querySelectorAll('form[data-comment]').forEach(f=>
f.addEventListener('submit',e=>{e.preventDefault();doComment(f.dataset.comment,f);}));
const lc=document.querySelector('form[data-listcomment]');
if(lc)lc.addEventListener('submit',e=>{e.preventDefault();doListComment(lc);});
const af=$('#av-file'); if(af)af.addEventListener('change',onAvatarFile);
const ff=$('#fav-file'); if(ff)ff.addEventListener('change',async e=>{
const file=e.target.files[0]; if(!file)return;
try{ const data=await cropImage(file,64,64); S.favicon=data; applyFavicon();
await sb.from('meta').upsert({key:'favicon',value:data}); toast('site icon updated'); render(); }
catch{toast('could not read image','error')} });
const fs=$('#feed-search');
if(fs){fs.value=feedQ;fs.addEventListener('input',e=>{feedQ=e.target.value;
const el=$('#feed-list');if(el)el.innerHTML=feedPostsHTML();});}
const bf=$('#li-banner-file'); if(bf)bf.addEventListener('change',async e=>{
const file=e.target.files[0]; if(!file)return;
try{syncListDraft();listDraft.banner=await cropImage(file,900,300);render();}catch{toast('could not read image','error')} });
const lif=$('#li-icon-file'); if(lif)lif.addEventListener('change',async e=>{
const file=e.target.files[0]; if(!file)return;
try{syncListDraft();listDraft.iconImg=await cropImage(file,96,96);render();}catch{toast('could not read image','error')} });
const tf=$('#it-thumb-file'); if(tf)tf.addEventListener('change',async e=>{
const file=e.target.files[0]; if(!file)return;
try{syncItemDraft();itemDraft.thumb=await cropImage(file,200,200);render();}catch{toast('could not read image','error')} });
const pf=$('#it-photos-file'); if(pf)pf.addEventListener('change',async e=>{
const files=[...e.target.files]; if(!files.length)return; syncItemDraft();
try{for(const file of files){if(itemDraft.photos.length>=6){toast('max 6 photos','error');break}
itemDraft.photos.push(await fitImage(file,800));}render();}catch{toast('could not read image','error')} });
}
async function doLogin(f){ const u=f.elements.u.value.trim(),p=f.elements.p.value,err=$('#auth-err');
if(!u||!p){err.textContent='fill in both fields';return}
const {error}=await sb.auth.signInWithPassword({email:u2e(u),password:p});
if(error){err.textContent='wrong username or password';return}
await loadAll(); go({name:'feed'}); toast('welcome back, '+u); }
async function doSignup(f){ const u=f.elements.u.value.trim(),p=f.elements.p.value,p2=f.elements.p2.value,err=$('#auth-err');
if(!/^[a-z0-9_]{3,16}$/i.test(u)){err.textContent='username: 3–16 letters, numbers or _';return}
if(findUser(u)){err.textContent='that username is taken';return}
if(p.length<6){err.textContent='password needs at least 6 characters';return}
if(p!==p2){err.textContent="passwords don't match";return}
const {data,error}=await sb.auth.signUp({email:u2e(u),password:p});
if(error){err.textContent=error.message;return}
if(!data.session){err.textContent='email confirmation is ON in Supabase — turn it off (Authentication → Providers → Email)';return}
let role='';
if(u.toLowerCase()==='myszon'&&!S.users.some(x=>x.role==='admin'))role='admin';
const prof={id:data.user.id,username:u,avatar:'',bio:'',role,joined:Date.now()};
const {error:e2}=await sb.from('profiles').insert({id:prof.id,username:prof.username,avatar:'',bio:'',role:prof.role,joined:new Date().toISOString()});
if(e2){err.textContent='could not create profile: '+e2.message;return}
S.users.push(prof); await loadAll();
go({name:'feed'}); toast(role?'welcome, admin':'welcome to the community'); }
async function doPost(f){ const t=f.elements.t.value.trim(); const atts=(attach['post']||[]).slice();
if(!t&&!atts.length)return;
const p={id:uid(),author:me.username,text:t,tags:postTags.slice(),attachments:atts,ts:Date.now(),likes:[],comments:[],group:f.dataset.group||null};
if(!await dbInsert('posts',{id:p.id,owner:me.id,data:p}))return;
S.posts.unshift(p); attach['post']=[]; postTags=[]; feedQ='';
notifyMentions(t,'post'); render(); }
async function doComment(id,f){ const t=f.elements.c.value.trim(); const key='cmt:'+id;
const atts=(attach[key]||[]).slice(); if(!t&&!atts.length)return;
const p=S.posts.find(x=>x.id===id); if(!p)return;
p.comments.push({id:uid(),author:me.username,text:t,attachments:atts,ts:Date.now()});
attach[key]=[]; notifyMentions(t,'comment'); render(); await savePostRow(p);
const inp=document.querySelector('form[data-comment="'+id+'"] input'); if(inp)inp.focus(); }
async function doListComment(f){ const t=f.elements.c.value.trim(); const atts=(attach['lcmt']||[]).slice();
if(!t&&!atts.length)return;
const l=S.lists.find(x=>x.slug===view.slug); if(!l)return;
l.comments=l.comments||[];
l.comments.push({id:uid(),author:me.username,text:t,attachments:atts,ts:Date.now()});
attach['lcmt']=[]; notifyMentions(t,'list comment'); render(); await saveListRow(l); }
async function doCreateGroup(f){ const name=f.elements.name.value.trim(),desc=f.elements.desc.value.trim();
if(name.length<3){toast('group name too short','error');return}
const emojis=['🟩','🟨','🔺','⭐','💠','🌀','👾','🎮','🕹️','🧊','😈','🚀'];
const g={id:uid(),name,desc,emoji:emojis[Math.floor(Math.random()*emojis.length)],members:[me.username],owner:me.username,ts:Date.now()};
if(!await dbInsert('groups',{id:g.id,owner:me.id,data:g}))return;
S.groups.push(g); go({name:'group',id:g.id}); toast('group created'); }
async function doSendDM(f){ const t=f.elements.t.value.trim(); const atts=(attach['dm']||[]).slice();
if(!t&&!atts.length)return; if(!dmWith)return;
const tid=[me.username,dmWith].sort().join('|');
let th=S.dms.find(x=>x.id===tid); const isNew=!th;
if(isNew){th={id:tid,members:[me.username,dmWith],msgs:[]};S.dms.push(th);}
th.msgs.push({from:me.username,text:t,attachments:atts,ts:Date.now()});
attach['dm']=[];
if(isNew){const u2=findUser(dmWith); await sb.from('dms').insert({id:tid,members:[me.id,u2.id],data:th});}
else await dbUpd('dms',tid,{data:th});
notify(dmWith,{type:'mention',from:me.username,where:'DM'});
focusDM=true; render(); }
async function doSaveBio(f){ await saveUser({bio:f.elements.bio.value.trim()}); toast('bio saved'); }
async function doSaveRules(f){ const l=S.lists.find(x=>x.slug===view.slug); if(!l||!canList(l))return;
l.rules=f.elements.rules.value; l.edited=Date.now(); render(); await saveListRow(l); toast('rules saved'); }
async function doAddVictor(f){ const ctx=levelCtx(); if(!ctx||!canList(ctx.list))return;
const name=f.elements.name.value.trim();
if(!name){toast('write who beat it','error');return}
const l=S.lists.find(x=>x.id===ctx.list.id); const it=l.items.find(x=>x.id===ctx.item.id);
it.victors=it.victors||[];
it.victors.push({name,video:normUrl(f.elements.video.value),ts:Date.now()});
it.edited=l.edited=Date.now();
const u=findUser(name); if(u)notify(u.username,{type:'mention',from:me.username,where:'new record'});
render(); await saveListRow(l); toast(name+' added as victor'); }
async function doAddDir(f,table,msg,emojis){ if(!isAdmin())return;
const name=f.elements.name.value.trim(),url=normUrl(f.elements.url.value),desc=f.elements.desc.value.trim();
if(!name||!url){toast('needs a name and a link','error');return}
const obj={id:uid(),name,url,desc,emoji:emojis[Math.floor(Math.random()*emojis.length)],ts:Date.now()};
if(!await dbInsert(table,{id:obj.id,data:obj}))return;
(table==='sites'?S.sites:S.olists).push(obj); toast(msg); render(); }
async function doSaveList(f){ syncListDraft();
const name=(listDraft.name||'').trim();
if(name.length<2){toast('the list needs a name','error');return}
const desc=(listDraft.desc||'').trim(),rules=listDraft.rules||'',discord=normUrl(listDraft.discord);
if(listModal==='new'){
const l={id:uid(),slug:uniqueListSlug(name),name,desc,rules,discord,icon:listDraft.icon,iconImg:listDraft.iconImg,color:listDraft.color,banner:listDraft.banner,
author:me.username,created:Date.now(),edited:Date.now(),reacts:{},comments:[],items:[]};
if(!await dbInsert('lists',{id:l.id,owner:me.id,slug:l.slug,data:l}))return;
S.lists.push(l); listModal=null; toast('list created');
go({name:'listview',slug:l.slug}); return; }
const l=S.lists.find(x=>x.id===listModal);
if(l&&canList(l)){Object.assign(l,{name,desc,rules,discord,icon:listDraft.icon,iconImg:listDraft.iconImg,color:listDraft.color,banner:listDraft.banner,edited:Date.now()});
await saveListRow(l); toast('list updated');}
listModal=null; render(); }
async function doSaveItem(f){ syncItemDraft();
const d=itemDraft; if(!d||!itemModal)return;
const title=(d.title||'').trim();
if(title.length<2){toast('the level needs a name','error');return}
const tags=(d.tags||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);
const points=Math.max(0,Math.min(99999,parseInt(d.points,10)||0));
const verifier={name:(d.vname||'').trim(),video:normUrl(d.vvideo)};
const l=S.lists.find(x=>x.id===itemModal.list); if(!l||!canList(l))return;
if(itemModal.id){ const it=l.items.find(x=>x.id===itemModal.id);
if(it){Object.assign(it,{title,desc:d.desc.trim(),tags,points,verifier,thumb:d.thumb,photos:d.photos,edited:Date.now()});
l.edited=Date.now(); toast('level updated');} }
else { const slug=uniqueItemSlug(l,title);
l.items.push({id:uid(),slug,title,desc:d.desc.trim(),tags,points,verifier,
victors:[],thumb:d.thumb,photos:d.photos,ratings:{},author:me.username,created:Date.now(),edited:Date.now()});
l.edited=Date.now(); openLevel=slug; toast('level added (at the bottom — use ↑↓ to move it)'); }
render(); await saveListRow(l); itemModal=null; }
async function onAvatarFile(e){ const file=e.target.files[0]; if(!file)return;
if(!file.type.startsWith('image/')){toast('that is not an image','error');return}
if(file.size>8*1024*1024){toast('image too big (max 8MB)','error');return}
try{ await saveUser({avatar:await cropImage(file,144,144)}); toast('avatar updated'); }
catch{toast('could not read that image','error')} }
/* boot */
if(!CONFIGURED){ renderSetup(); }
else { applyFavicon(); if(sb){ init().catch(e=>{ bootState='error'; bootError=e.message; render(); }); } else render(); }
</script>
</body>
